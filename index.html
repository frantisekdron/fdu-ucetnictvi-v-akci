<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Účetnictví v akci</title>
<style>
:root{--bg:#f5f4f0;--panel:#fff;--line:#e3e0d8;--txt:#1c2228;--mut:#6a7280;--acc:#1f6feb;--ok:#2e8b57;--warn:#b7791f;--bad:#c0392b;--chip:#eef2f7}
@media (prefers-color-scheme:dark){:root{--bg:#101317;--panel:#181d23;--line:#2a313a;--txt:#e7eaee;--mut:#97a1ad;--acc:#58a6ff;--chip:#222a33}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 110px}h1{font-size:22px;margin:0}h2{font-size:18px;margin:22px 0 8px}h3{font-size:15px;margin:16px 0 6px}
.mut{color:var(--mut)}.small{font-size:13px}.r{text-align:right;white-space:nowrap}
#login{max-width:380px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
input,textarea,select{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--txt);color:var(--bg);cursor:pointer;font-weight:600}
button.sec{background:transparent;color:var(--txt);border:1px solid var(--line);font-weight:500}button.mini{padding:3px 9px;font-size:12px;font-weight:500}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}nav button{background:var(--panel);color:var(--txt);border:1px solid var(--line);font-weight:500}
nav button.on{background:var(--txt);color:var(--bg)}
.karty{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.karta{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.karta b.velke{display:block;font-size:24px;margin-top:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{color:var(--mut);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.chip{display:inline-block;background:var(--chip);border-radius:20px;padding:1px 9px;font-size:12px;margin:1px 2px 1px 0}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}a{color:var(--acc);cursor:pointer}
.otazka{border-left:4px solid var(--warn);padding:8px 12px;margin:8px 0;background:var(--panel);border-radius:0 10px 10px 0}
.otazka.PHM{border-color:var(--bad)}.otazka textarea{margin-top:6px;min-height:38px}
#lista{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px;display:none}
#lista .in{max-width:1080px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal .box{background:var(--panel);border-radius:14px;width:min(1000px,100%);height:90vh;display:flex;flex-direction:column;overflow:hidden}
#modal .hl{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
#modal iframe,#modal img{flex:1;border:0;width:100%;object-fit:contain;background:#fff}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.flow .karta h3{margin-top:0}
.bar{height:8px;border-radius:4px;background:var(--acc);display:inline-block;vertical-align:middle}.bar.n{background:var(--warn)}
.skryt{display:none}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:20;max-width:calc(100% - 32px)}
#toast.chyba{background:var(--bad);color:#fff}
</style></head><body>
<div id="login"><h1>Účetnictví v akci</h1><p class="mut">František Dron s.r.o.</p>
<p><input id="hs" type="password" placeholder="Heslo" autocomplete="current-password"></p>
<p><label class="small"><input type="checkbox" id="pamatuj" checked style="width:auto;vertical-align:middle"> Zapamatovat na tomto zařízení</label></p>
<p><button id="prihlasit">Přihlásit</button> <span id="chyba" class="bad small"></span></p>
<p class="mut small">Data jsou zašifrovaná – bez hesla se nedají přečíst.</p></div>
<div class="wrap skryt" id="app"></div><div id="toast"></div>
<div id="lista"><div class="in"><b id="pocet">0 poznámek</b><span class="mut small" id="poslednipozn"></span>
<span style="flex:1"></span><button class="sec" id="smazat">Smazat</button><button id="odeslat">Odeslat poznámky e-mailem</button></div></div>
<div id="modal"><div class="box"><div class="hl"><b id="mtit"></b><button class="sec mini" id="mzavrit">Zavřít ✕</button></div><div id="mobsah" style="flex:1;display:flex"></div></div></div>

const SYSTEM_MAIL='honza@frantisekdron.cz';
let D=null, KLIC=null, UZ='', POZN=[], TAB='prehled';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const kc=x=>x==null?'—':(x<0?'−':'')+Math.abs(x).toLocaleString('cs-CZ',{minimumFractionDigits:0,maximumFractionDigits:2})+' Kč';
const dt=s=>s?(+s.slice(8,10))+'. '+(+s.slice(5,7))+'. '+s.slice(0,4):'';
async function otevri(hs){   // heslo vyzkouší na všechny účty – kdo jsi, pozná web podle hesla
  for(const [jm,u] of Object.entries(UCTY)){ try{
    const zakl=await crypto.subtle.importKey('raw',new TextEncoder().encode(hs),'PBKDF2',false,['deriveKey']);
    const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(u.salt),iterations:u.iter,hash:'SHA-256'},zakl,{name:'AES-GCM',length:256},false,['decrypt']);
    return [jm, await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(u.iv)},kek,b64(u.klic))] }catch(e){} }
  return null }
async function prihlas(heslo,tichy){
  const hs=(heslo??$('#hs').value).trim(); if(!hs)return;
  if(!window.DecompressionStream||!crypto.subtle){$('#chyba').textContent='Starý prohlížeč – aktualizuj ho (Safari / iOS 16.4+, Chrome).';return}
  $('#chyba').textContent='Ověřuji…'; const n=await otevri(hs);
  if(!n){ try{localStorage.removeItem('fdu_heslo')}catch(e){} $('#chyba').textContent=tichy?'':'Špatné heslo.'; return }
  KLIC=await crypto.subtle.importKey('raw',n[1],'AES-GCM',false,['decrypt']);
  const b=b64(BALIK), pl=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},KLIC,b.slice(12));
  D=JSON.parse(await new Response(new Blob([pl]).stream().pipeThrough(new DecompressionStream('gzip'))).text()); UZ=n[0];
  try{ if($('#pamatuj').checked) localStorage.setItem('fdu_heslo',hs) }catch(e){}
  try{POZN=JSON.parse(localStorage.getItem('fdu_pozn_'+UZ)||'[]')}catch(e){POZN=[]}
  $('#login').classList.add('skryt'); $('#app').classList.remove('skryt'); $('#chyba').textContent='';
  try{ vykresli(UZ==='lenka'&&D.pro_lenku.length?'lenka':'prehled'); lista() }
  catch(e){ $('#app').innerHTML='<p class="bad">Web se nepodařilo zobrazit: '+esc(e.message)+'</p><button onclick="odhlas()">Odhlásit</button>' }
}
function odhlas(){ try{localStorage.removeItem('fdu_heslo')}catch(e){} location.replace(location.pathname) }
$('#prihlasit').onclick=()=>prihlas(); $('#hs').addEventListener('keydown',e=>{if(e.key==='Enter')prihlas()});
(()=>{ let h='';   // osobní odkaz …/#k=<heslo> přihlásí a heslo z adresy hned smaže; jinak zapamatované heslo
  if(location.hash.startsWith('#k=')){ h=decodeURIComponent(location.hash.slice(3)); history.replaceState(null,'',location.pathname+location.search) }
  if(!h) try{h=localStorage.getItem('fdu_heslo')||''}catch(e){}
  if(h) prihlas(h,true) })();
async function otevriDoklad(klic,nazev){
  $('#mtit').textContent=nazev; $('#mobsah').innerHTML='<p class="mut" style="padding:16px">Dešifruji…</p>'; $('#modal').style.display='flex';
  const r=await fetch('doc/'+klic+'.bin'); const b=new Uint8Array(await r.arrayBuffer());
  const pl=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},KLIC,b.slice(12)));
  const nl=pl.indexOf(10), typ=new TextDecoder().decode(pl.slice(0,nl)), url=URL.createObjectURL(new Blob([pl.slice(nl+1)],{type:typ}));
  $('#mobsah').innerHTML=typ.startsWith('image')?`<img src="${url}">`:`<iframe src="${url}"></iframe>`;
}
$('#mzavrit').onclick=()=>{$('#modal').style.display='none';$('#mobsah').innerHTML=''};
function pridejPozn(id,text){ if(!text)return; POZN=POZN.filter(p=>p.id!==id); POZN.push({id,text}); ulozPozn(); }
const neodeslane=()=>POZN.filter(p=>!p.odeslano);
function ulozPozn(){try{localStorage.setItem('fdu_pozn_'+UZ,JSON.stringify(POZN))}catch(e){} lista()}
function lista(){ const n=neodeslane(); $('#lista').style.display=n.length?'block':'none'; $('#pocet').textContent=n.length+(n.length===1?' poznámka':n.length<5?' poznámky':' poznámek')+' k odeslání';
  $('#poslednipozn').textContent=n.length?'Poslední: '+n[n.length-1].text.slice(0,60):'' }
$('#smazat').onclick=()=>{if(confirm('Smazat neodeslané poznámky?')){POZN=POZN.filter(p=>p.odeslano);ulozPozn()}};
$('#odeslat').onclick=async()=>{ const n=neodeslane(); if(!n.length)return;
  try{ await posli({druh:'poznamky',polozky:n.map(p=>({id:p.id,text:p.text}))}); n.forEach(p=>p.odeslano=1); ulozPozn(); toast('✓ Odesláno ('+n.length+')'); vykresli(TAB) }
  catch(e){ const t=n.map(p=>'['+p.id+'] '+p.text).join('\n\n');
    location.href='mailto:'+SYSTEM_MAIL+'?subject='+encodeURIComponent('[FD ÚČTO] poznámky – '+UZ+' – '+D.meta.obdobi)+'&body='+encodeURIComponent(t) } };
$('#odeslat').textContent='Odeslat';
const bt=u=>btoa(String.fromCharCode(...u));
const vyresBtn=a=>D.meta.most&&UZ==='franta'?`<button class="mini" onclick="vyres('${esc(a.id)}')">🛠 Vyřeš to se mnou</button> `:'';
function toast(t,chyba){ const e=$('#toast'); e.textContent=t; e.className=chyba?'chyba':''; e.style.display='block'; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display='none',chyba?9000:4000) }
async function sifruj(data){ const k=await crypto.subtle.importKey('raw',b64(D.meta.most.klic),'AES-GCM',false,['encrypt']), iv=crypto.getRandomValues(new Uint8Array(12));
  return [iv,new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,data))] }
async function posli(obsah,soubor){   // → šifrovaně přes ntfy do Clauda na Macu (fdu most) – text i soubory

  <button class="sec mini" onclick="rozhodni(D.chybejici[${i}],'nebude',this)">Nebude</button> <button class="sec mini" onclick="rozhodni(D.chybejici[${i}],'soukrome',this)">Soukromé</button><br>
  <button class="sec mini" onclick="komentujPlatbu(D.chybejici[${i}])">💬 Okomentovat</button></td></tr>`).join('')}
  ${C.length?`<tr style="font-weight:700"><td colspan="5">Celkem výdaje bez dokladu</td><td class="r">${cz(sum)}</td><td colspan="4"></td></tr>`:'<tr><td colspan="10" class="ok">Všechny platby mají doklad ✓</td></tr>'}</table>
  <p><button class="sec" onclick="chybiCSV()">⬇ Stáhnout tabulku (Excel / CSV)</button></p></div>
  <div class="panel small"><b>Jak to funguje, když doklad dohledáš později</b><br>
  1) Platba zůstane na účtu 395 „k doložení“ – v účetnictví nic nechybí, jen čeká (jako Lenčino „Nevím, zaúčtuje se později“).<br>
  2) Doklad nahraj tlačítkem <b>📎 Mám doklad</b> (i fotku z mobilu) nebo ho dej do složky <b>aktuálního</b> měsíce – ne do starého, ten už je podaný. Nevíš, jak platbu zařadit? <b>💬 Okomentovat</b> – napiš, o co šlo, a já ji zařadím.<br>
  3) Nejbližší běh 1. v měsíci ho přečte, sám ho spáruje s původní platbou a řádek z tabulky zmizí. Odpočet DPH se uplatní v měsíci, kdy doklad dorazil (dřív to zákon nedovolí).<br>
  4) Když doklad nebude: <b>Nebude</b> = nedaňový výdaj (účet 518999, jako to dělala Lenka), <b>Soukromé</b> = na vrub společníka (365). Rozhodnutí se odešle hned.</div>`}
function priznani(){ const kh=D.kh, s=r=>r?kc((r.zakl_dane1||0)+(r.zakl_dane2||0)):'—';
  return `<h2>Přiznání k DPH – ${esc(D.meta.obdobi_nazev)}</h2><div class="panel"><table><tr><th>Řádek</th><th>Co</th><th class="r">Kč</th></tr>
  ${D.priznani.map(r=>`<tr${r.klic==='dano_da'?' style="font-weight:700"':''}><td>${esc(r.radek)}</td><td>${esc(r.popis)}</td><td class="r">${kc(r.castka)}</td></tr>`).join('')}</table>
  <p><button onclick="stahni('DPHDP3_${D.meta.obdobi}.xml',D.xml.dp3)">⬇ Přiznání DPH (XML pro EPO)</button> <button onclick="stahni('DPHKH1_${D.meta.obdobi}.xml',D.xml.kh)">⬇ Kontrolní hlášení (XML)</button></p>
  <p class="mut small">XML se nahraje na portál MOJE daně (EPO) → „Načíst ze souboru“ → zkontrolovat → podat. Nic se neodesílá samo.</p></div>
  <h2>Kontrolní hlášení</h2><div class="panel"><table>
  <tr><td>A.2 – služby ze zahraničí (samovyměření)</td><td class="r">${kh.A2.length} řádků</td><td class="r">${kc(kh.A2.reduce((a,r)=>a+(r.zakl_dane1||0),0))}</td></tr>
  <tr><td>A.4 – vydané faktury nad 10 000 Kč</td><td class="r">${kh.A4.length} řádků</td><td class="r">${kc(kh.A4.reduce((a,r)=>a+(r.zakl_dane1||0),0))}</td></tr>
  <tr><td>A.5 – vydané do 10 000 Kč (souhrnně)</td><td></td><td class="r">${s(kh.A5)}</td></tr>
  <tr><td>B.2 – přijaté nad 10 000 Kč</td><td class="r">${kh.B2.length} řádků</td><td class="r">${kc(kh.B2.reduce((a,r)=>a+(r.zakl_dane1||0)+(r.zakl_dane2||0),0))}</td></tr>
  <tr><td>B.3 – přijaté do 10 000 Kč (souhrnně)</td><td></td><td class="r">${s(kh.B3)}</td></tr></table></div>
  ${D.varovani.length?`<h2>Upozornění výpočtu</h2><div class="panel small">${D.varovani.map(v=>'<p class="warn">⚠ '+esc(v)+'</p>').join('')}</div>`:''}`}
function rok(){ const r=D.rok, max=Math.max(...r.mesice.map(m=>Math.max(m.vynosy,m.naklady)),1), dp=D.prehled.dppo, rz=r.rozvaha;
  return `<h2>Výsledovka po měsících</h2><div class="panel"><table><tr><th>Měsíc</th><th>Výnosy</th><th>Náklady</th><th class="r">Výsledek</th></tr>
  ${r.mesice.map(m=>`<tr><td>${m.mesic}</td><td><span class="bar" style="width:${m.vynosy/max*160}px"></span> ${kc(m.vynosy)}</td><td><span class="bar n" style="width:${m.naklady/max*160}px"></span> ${kc(m.naklady)}</td><td class="r ${m.vysledek<0?'bad':'ok'}">${kc(m.vysledek)}</td></tr>`).join('')}
  <tr style="font-weight:700"><td>Celkem</td><td>${kc(r.mesice.reduce((a,m)=>a+m.vynosy,0))}</td><td>${kc(r.mesice.reduce((a,m)=>a+m.naklady,0))}</td><td class="r">${kc(r.mesice.reduce((a,m)=>a+m.vysledek,0))}</td></tr></table>
  <p class="mut small">Leden–září z Pohody (Lenka), od října zaúčtováno automaticky z dokladů a banky.</p></div>
  <h2>Daň z příjmů za rok – odhad</h2><div class="panel"><table>
  <tr><td>Výsledek k datu</td><td class="r">${kc(dp.vysledek_k_datu)}</td></tr><tr><td>− plánované odpisy majetku do konce roku</td><td class="r">${kc(-dp.plan_odpisu_do_konce_roku)}</td></tr>
  <tr><td>= výsledek roku (pokud do konce roku nic dalšího)</td><td class="r"><b>${kc(dp.vysledek_rok)}</b></td></tr><tr><td>+ nedaňové náklady</td><td class="r">${kc(dp.nedanove)}</td></tr>
  <tr><td>− daňová ztráta z minulých let</td><td class="r">${kc(-dp.ztrata_minulych_let)}</td></tr><tr><td><b>Daň (21 %)</b></td><td class="r"><b>${kc(dp.dan)}</b></td></tr></table>
  ${dp.nova_ztrata<0?`<p class="small">Letos vychází daňová ztráta <b>${kc(dp.nova_ztrata)}</b> – dá se odečíst od zisku v dalších 5 letech. Každá další tržba do konce roku ji jen snižuje (daň zatím 0 Kč).</p>`:''}</div>
  <h2>Rozvaha k ${dt(D.meta.stav_k)}</h2><div class="karty"><div class="panel"><h3>Aktiva (co firma má)</h3><table>${rz.aktiva.map(x=>`<tr><td>${esc(x.nazev)}</td><td class="r">${kc(x.castka)}</td></tr>`).join('')}<tr style="font-weight:700"><td>Celkem</td><td class="r">${kc(rz.aktiva_celkem)}</td></tr></table></div>
  <div class="panel"><h3>Pasiva (z čeho je to financované)</h3><table>${rz.pasiva.map(x=>`<tr><td>${esc(x.nazev)}</td><td class="r ${x.castka<0?'bad':''}">${kc(x.castka)}</td></tr>`).join('')}<tr style="font-weight:700"><td>Celkem</td><td class="r">${kc(rz.pasiva_celkem)}</td></tr></table></div></div>
  <h2>Náklady letos podle druhu</h2><div class="panel"><table>${r.skupiny.map(s=>`<tr><td>${esc(s.nazev)}</td><td class="r">${kc(s.castka)}</td></tr>`).join('')}</table></div>`}
function kontrola(){ const z=D.zari, dano=z.radky.find(r=>r.klic==='dano_da')||{}, jine=z.radky.filter(r=>r.lenka!==r.nase&&r.klic!=='dano_da'),
    sam=z.rozpis.filter(r=>r.samovymereni&&r.rozdil), suma=sam.reduce((a,r)=>a+r.rozdil,0), zn=x=>(x>0?'+':x<0?'−':'')+cz(Math.abs(x))+' Kč';
  return `<h2>Kontrola: ${esc(D.meta.kontrola_nazev)} – systém vs. Lenka</h2><p class="mut">Systém si měsíc spočítal sám ze stejných dokladů. Dokladů ${z.pocet}, na haléř sedí ${z.pocet-z.rozpis.length}.</p>
  <div class="panel"><p style="margin:0 0 6px"><b class="${dano.lenka===dano.nase?'ok':'bad'}">${dano.lenka===dano.nase?'✓ Daň k úhradě sedí na korunu':'≠ Daň k úhradě se liší'}: Lenka ${kc(dano.lenka)}, systém ${kc(dano.nase)}.</b></p>
  ${jine.length&&sam.length?`<p style="margin:0">Rozdíl ${jine.some(r=>/^ř\. (5|12|43)/.test(r.popis))?'je jen v řádcích samovyměření (služby ze zahraničí, ř. 12 a 43) a v součtech pod nimi':'je v řádcích níže'}. U samovyměření se daň přizná a hned odečte, takže na výsledné dani se rozdíl vyruší. Dělají ho jen doklady v rozpisu níže, dohromady <b>${zn(suma)}</b> základu (přiznání se zaokrouhluje na koruny).</p>`:''}</div>
  <div class="panel"><table><tr><th>Řádek přiznání</th><th class="r">Lenka</th><th class="r">Systém</th><th></th></tr>
  ${z.radky.map(r=>`<tr><td>${esc(r.popis)}</td><td class="r">${kc(r.lenka)}</td><td class="r">${kc(r.nase)}</td><td>${r.lenka===r.nase?'<span class="ok">✓</span>':'<span class="warn">≠ '+zn(r.nase-r.lenka).replace(',00','')+'</span>'}</td></tr>`).join('')}</table></div>
  ${z.rozpis.length?`<h2>Proč to nesedí – rozpis po dokladech</h2><div class="panel"><table><tr><th>Doklad</th><th class="r">Lenka</th><th class="r">Systém</th><th class="r">Rozdíl</th><th>Proč</th></tr>
  ${z.rozpis.map(r=>`<tr><td><b>${esc(r.firma)}</b><br><span class="small mut">${esc(r.cislo)}</span></td><td class="r">${r.lenka==null?'nemá':cz(r.lenka)}</td><td class="r">${r.nase==null?'nemá':cz(r.nase)}</td><td class="r">${r.rozdil?zn(r.rozdil):'daň '+zn(r.rozdil_dan)}</td><td class="small">${esc(r.vysvetleni)}</td></tr>`).join('')}
  ${sam.length?`<tr style="font-weight:700"><td>Celkem samovyměření</td><td></td><td></td><td class="r">${zn(suma)}</td><td class="small">= rozdíl základu v ř. 12 a 43</td></tr>`:''}</table>
  <p class="small mut" style="margin:8px 0 0">Částky jsou základ daně v Kč. Ostatní doklady sedí na haléř. Co Lenka v podání nemá nebo má s jinou částkou, doplní následné kontrolní hlášení – u samovyměření se na dani nic nemění.</p></div>`:''}`}
function jak(){ return `<h2>Jak to funguje</h2><div class="flow">
  <div class="karta"><h3>1 · Ty zadáváš</h3>Faktury vystavuješ ve <b>FakturaOnline</b> (systém je stáhne sám).<br>Přijaté doklady: nahoře <b>📎 Nahrát doklad</b> (i z mobilu – fotka účtenky stačí), nebo přijdou e-mailem na <b>${SYSTEM_MAIL}</b>, nebo je hodíš do složky <i>FAKTURY/rok/měsíc</i>. Cokoli dalšího napiš přes <b>💬 Komentář</b>.</div>
  <div class="karta"><h3>2 · AI účetní 1. den v měsíci</h3>Stáhne vydané faktury, přílohy z pošty a faktury ze Stripe, Alzy…; přečte je (i fotky), načte banku, spáruje platby s doklady, zaúčtuje do deníku, spočítá DPH a kontrolní hlášení, připraví XML a vygeneruje tenhle web.</div>
  <div class="karta"><h3>3 · Co z toho leze</h3>Přiznání DPH + kontrolní hlášení (XML pro EPO), otázky na to, co chybí (PHM účtenky, faktury pravidelných dodavatelů…), vyřazené doklady s důvodem, výsledovka, rozvaha, odhad daně z příjmů a termíny.</div>
  <div class="karta"><h3>Doklad dohledáš později?</h3>Nevadí – platba čeká v tabulce <a onclick="vykresli('chybi')">Chybějící doklady</a> (účet 395), dokud doklad nepřijde. Pak se sám spáruje s původní platbou, DPH se odečte v měsíci, kdy dorazil. Když nebude: nedaňový výdaj 518999.</div>
  <div class="karta"><h3>4 · Kontrola a podání</h3>Lenka / Franta projde otázky a přiznání, poznámky odešle tlačítkem dole. Přiznání se podává ručně přes EPO – systém nic neodesílá úřadům ani neplatí.</div></div>
  ${D.analyza.length?`<h2>Analýza a doporučení</h2>${ANA().map((a,i,arr)=>((a.stav==='vyreseno'&&(!i||arr[i-1].stav!=='vyreseno'))?`<h2>📁 Archiv vyřešených připomínek (${ARCHIV().length})</h2><p class="mut">Co jsme už vyřešili a jak – zůstává tu pro přehled. Lenka je má i v záložce K odsouhlasení.</p>`:'')+`<div class="panel"><span class="chip">${esc(a.oblast)}</span> ${a.stav==='vyreseno'?'<span class="chip ok">✓ vyřešeno</span>':`<span class="chip ${a.priorita<=1?'bad':a.priorita==2?'warn':''}">priorita ${a.priorita}</span>`}<h3>${esc(a.titulek)}</h3><p><b>Problém:</b> ${esc(a.nalez)}</p>${a.vysvetleni?`<p><b>Lidsky:</b> ${esc(a.vysvetleni)}</p>`:''}<p><b>Doporučení:</b> ${esc(a.doporuceni)}</p>${a.dopad?`<p class="mut small">Dopad: ${esc(a.dopad)}</p>`:''}${reseni(a)}${a.stav==='vyreseno'?'':vyresBtn(a)}<button class="sec mini" onclick="pridejPozn('analyza-${esc(a.id)}',prompt('Souhlas / poznámka k: ${esc(a.titulek).replace(/'/g,'')}'))">💬 Reagovat</button></div>`).join('')}`:''}`}
</script></body></html>
