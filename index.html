<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Vzhled 3. 11. 2026 – Franta: „lepší, přehlednější, intuitivnější a hlavně hezčí… vymaž duplicity, co nejjednodušší“.
   Podpis: časová osa měsíce jako ve střihu – pohyby v bance jako klipy, DNES jako playhead, termín DPH jako značka. */
:root{--bg:#ECEFF5;--panel:#fff;--sunk:#F7F8FA;--line:#E4E7EC;--line2:#D0D5DD;--ink:#101828;--ink2:#344054;--mut:#667085;
  --acc:#3B5BFD;--acc-bg:#EEF2FF;--ok:#067647;--ok-bg:#ECFDF3;--warn:#B54708;--warn-bg:#FFFAEB;--bad:#B42318;--bad-bg:#FEF3F2;
  --rec:#F04438;--in:#17B26A;--out:#98A2B3;--miss:#F79009;--len:#DD2590;--len-bg:#FDF2FA;
  --sh:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);--sh-lg:0 18px 40px -12px rgba(16,24,40,.25);
  --fd:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--fb:"Geist",ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
  --fm:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;color-scheme:light}
:root[data-theme="dark"]{--bg:#07090E;--panel:#141A25;--sunk:#0F141D;--line:#252E3E;--line2:#323C4E;--ink:#ECEFF5;--ink2:#C3CAD7;--mut:#8994A8;--acc:#8EA2FF;--acc-bg:rgba(142,162,255,.13);--ok:#47CD89;--ok-bg:rgba(71,205,137,.12);--warn:#FDB022;--warn-bg:rgba(253,176,34,.12);--bad:#F97066;--bad-bg:rgba(249,112,102,.12);--in:#47CD89;--out:#4A5568;--miss:#FDB022;--len:#F670C7;--len-bg:rgba(246,112,199,.14);--sh:none;--sh-lg:0 18px 44px -12px rgba(0,0,0,.7);color-scheme:dark}
@media (prefers-color-scheme:dark){:root[data-theme="auto"]{--bg:#07090E;--panel:#141A25;--sunk:#0F141D;--line:#252E3E;--line2:#323C4E;--ink:#ECEFF5;--ink2:#C3CAD7;--mut:#8994A8;--acc:#8EA2FF;--acc-bg:rgba(142,162,255,.13);--ok:#47CD89;--ok-bg:rgba(71,205,137,.12);--warn:#FDB022;--warn-bg:rgba(253,176,34,.12);--bad:#F97066;--bad-bg:rgba(249,112,102,.12);--in:#47CD89;--out:#4A5568;--miss:#FDB022;--len:#F670C7;--len-bg:rgba(246,112,199,.14);--sh:none;--sh-lg:0 18px 44px -12px rgba(0,0,0,.7);color-scheme:dark}}
html[data-text="vetsi"]{zoom:1.1}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--fb);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 320px at 78% -80px,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%),
    radial-gradient(520px 300px at -6% 18%,color-mix(in srgb,var(--len) 9%,transparent),transparent 70%),
    radial-gradient(620px 340px at 104% 92%,color-mix(in srgb,var(--in) 8%,transparent),transparent 70%)}
/* kresbičky na pozadí (Franta 3. 11.: „dej tam něco trošku funny, zlehka, ať to nedělá bordel“) – jen na pozadí, karty jsou neprůhledné */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='280' height='280' viewBox='0 0 280 280' fill='none' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><g stroke='%233B5BFD' transform='translate(26 28) rotate(-8)'><rect x='14' y='10' width='16' height='10' rx='3'/><path d='M14 12 6 6M30 12l8-6M14 18l-8 6M30 18l8 6'/><circle cx='5' cy='5' r='5'/><circle cx='39' cy='5' r='5'/><circle cx='5' cy='25' r='5'/><circle cx='39' cy='25' r='5'/></g><g stroke='%23F79009' transform='translate(178 20)'><circle cx='16' cy='16' r='14'/><circle cx='16' cy='16' r='10' stroke-dasharray='2 3'/><text x='16' y='20' font-family='Arial' font-weight='700' font-size='10' text-anchor='middle' fill='%23F79009' stroke='none'>Kč</text></g><g stroke='%2317B26A' transform='translate(112 92) rotate(6)'><path d='M0 0h26v34l-4-3-4 3-5-3-4 3-4-3-5 3z'/><path d='M5 8h16M5 14h16M5 20h10'/></g><g stroke='%23DD2590' transform='translate(28 160) rotate(-10)'><rect width='26' height='34' rx='4'/><rect x='5' y='5' width='16' height='8' rx='1.5'/><path d='M8 20h.01M13 20h.01M18 20h.01M8 26h.01M13 26h.01M18 26h.01' stroke-width='3'/></g><g stroke='%238E7BFF' transform='translate(200 160)'><path d='M2 8h20v10a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8z'/><path d='M22 11h3a4 4 0 0 1 0 8h-3'/><path d='M8 1c-2 2 2 3 0 5M14 1c-2 2 2 3 0 5'/></g><g stroke='%233FB8FF' transform='translate(118 214)'><path d='M0 26h32M4 26V14M12 26V6M20 26v-9M28 26V2'/></g><g stroke='%23FFB020'><path d='M246 100l3 7 7 3-7 3-3 7-3-7-7-3 7-3z'/><path d='M84 120l2 4 4 2-4 2-2 4-2-4-4-2 4-2z'/></g><g stroke='%23FF5F6D' transform='translate(212 232) rotate(-15)'><path d='M0 10 30 0 20 26 14 16z'/><path d='M14 16 30 0'/></g></svg>");background-size:280px 280px;opacity:var(--kresby,.16)}
:root[data-theme="dark"]{--kresby:.13}
@media (prefers-color-scheme:dark){:root[data-theme="auto"]{--kresby:.13}}
#login,#app{position:relative;z-index:1}
h1,h2,h3{margin:0;font-family:var(--fd);letter-spacing:-.015em;color:var(--ink)}
h1{font-size:30px;font-weight:650;line-height:1.15}h2{font-size:19px;font-weight:620}h3{font-size:15.5px;font-weight:600;font-family:var(--fb);letter-spacing:0}
p{margin:0}a{color:var(--acc);cursor:pointer;text-decoration:none}a:hover{text-decoration:underline}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}.mono{font-family:var(--fm);font-size:.9em}.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.skryt{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
/* tlačítka a pole */
.btn{display:inline-flex;align-items:center;gap:7px;font:500 14px/1 var(--fb);color:var(--ink);background:var(--panel);border:1px solid var(--line2);
  border-radius:10px;padding:9px 13px;cursor:pointer;white-space:nowrap;box-shadow:var(--sh);transition:background .12s,border-color .12s}
.btn:hover{background:var(--sunk)}.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.pri:hover{opacity:.9}
.btn.sm{font-size:13px;padding:6px 10px;border-radius:8px}.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink2)}
.btn.ghost:hover{background:var(--sunk)}.btn.okb{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:42px;resize:vertical}input:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--acc) 45%,transparent);border-color:var(--acc)}
/* přihlášení */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.lcard{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px 28px;box-shadow:var(--sh-lg)}
.lcard h1{font-size:26px;margin:18px 0 2px}.lcard .f{margin-top:18px;display:grid;gap:12px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}.chk input{width:auto;margin:0}
.mark{width:38px;height:38px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 14px/1 var(--fd);position:relative;flex:none}
.mark::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--rec)}
/* rozvržení */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:20px 14px;background:var(--panel);border-right:1px solid var(--line)}
.brand{display:flex;gap:11px;align-items:center;padding:2px 6px 14px}.brand b{display:block;font:600 15px/1.2 var(--fd)}.brand span{font-size:12px;color:var(--mut)}
.per{margin:0 6px 10px;padding:8px 10px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);font-size:13px;color:var(--ink2)}
.per b{display:block;font:600 15px/1.3 var(--fd);color:var(--ink)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink2);font-weight:500;text-decoration:none}
.nav a:hover{background:var(--sunk)}.nav a.on{background:var(--acc-bg);color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.card,.task,.todo{transition:border-color .15s,box-shadow .15s,transform .15s}.todo:hover{transform:translateY(-1px)}
.badge{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:20px;font:600 12px/18px var(--fb);text-align:center;background:var(--warn-bg);color:var(--warn)}
.badge.z{background:var(--sunk);color:var(--mut)}
.sfoot{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:10px}
.sfoot a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink2);font-size:14px;text-decoration:none}.sfoot a:hover{background:var(--sunk)}
.who{padding:8px 10px;font-size:13px;color:var(--mut)}
.main{min-width:0;padding:30px 36px 130px}.inner{max-width:1060px;margin:0 auto}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font:500 12px/1.4 var(--fm);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.ph .sub{color:var(--mut);margin-top:4px}.ph-act{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
.pad{padding:20px 22px}.sec{margin-top:28px}.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-h p{color:var(--mut);font-size:13.5px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
/* přehled */
.hero{display:grid;grid-template-columns:1.25fr 1fr;overflow:hidden;background:linear-gradient(140deg,color-mix(in srgb,var(--acc) 9%,var(--panel)),var(--panel) 58%)}
.hero-l{padding:24px 26px}.hero-num{font:650 56px/1.02 var(--fd);letter-spacing:-.03em;margin:8px 0 14px;font-variant-numeric:tabular-nums}
.hero-num small{font-size:24px;font-weight:600;color:var(--mut);margin-left:6px;letter-spacing:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:500;background:var(--sunk);color:var(--ink2)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.hero-r{background:var(--sunk);border-left:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:8px}
.todo{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--ink);text-decoration:none}
.todo:hover{border-color:var(--line2);text-decoration:none;box-shadow:var(--sh)}
.todo .n{font:650 22px/1 var(--fd);min-width:30px;font-variant-numeric:tabular-nums}.todo .n.z{color:var(--ok)}
.todo .t{flex:1;min-width:0}.todo .t b{display:block;font-weight:600;font-size:14.5px}.todo .t span{font-size:12.5px;color:var(--mut)}
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);overflow:hidden}
.money>div{padding:16px 18px;background:var(--panel)}
.money span{display:block;font-size:12.5px;color:var(--mut)}.money b{display:block;font:620 19px/1.3 var(--fd);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.money i{font-style:normal;font-size:12px;color:var(--mut)}
.money>button.mt{padding:16px 18px;background:var(--panel);border:0;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:background .15s}
.money>button.mt:hover,.money>button.mt:focus-visible{background:var(--sunk)}.money>button.mt i{color:var(--acc,var(--mut))}
.fs .cb{display:inline-block;margin-left:6px;font-size:11.5px;color:var(--mut);border:1px dashed var(--line2);border-radius:999px;padding:1px 8px;white-space:nowrap}
.list{display:flex;flex-direction:column}.li{display:flex;gap:14px;padding:11px 0;border-top:1px solid var(--line);align-items:baseline}.li:first-child{border-top:0}
.li .d{font:500 12.5px/1.5 var(--fm);color:var(--mut);min-width:64px}
/* časová osa */
.osa-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:18px 22px 4px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}
.osa{display:block;width:100%;height:auto;padding:0 8px;touch-action:pan-y}
.osa text{font:500 10.5px var(--fm);fill:var(--mut)}.osa .tp{font-weight:600;letter-spacing:.06em}
.tk{transform-box:fill-box;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;cursor:pointer}.tk.up{transform-origin:50% 100%}.tk.dn{transform-origin:50% 0}
.osa.static .tk{animation:none}.t-in{fill:var(--in)}.t-out{fill:var(--out)}.t-miss{fill:var(--miss)}.tk.sel{stroke:var(--ink);stroke-width:1.5}
@keyframes grow{from{transform:scaleY(0)}}
.ph-line{stroke:var(--rec);stroke-width:2}.ph-dot{fill:var(--rec)}
@keyframes blik{50%{opacity:.35}}.ph-dot{animation:blik 1.6s ease-in-out infinite}
.osa-info{padding:6px 22px 16px;font-size:13px;color:var(--mut);min-height:40px}.osa-info b{color:var(--ink)}
/* úkoly */
.task{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--sh)}
.tasks{display:flex;flex-direction:column;gap:10px}
.task-h{display:flex;gap:10px;align-items:flex-start}.task-h h3{flex:1;line-height:1.4}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font:500 11.5px/1.5 var(--fm);background:var(--sunk);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.task .po{color:var(--ink2);margin-top:6px;font-size:14px}.task .ask{margin-top:10px;font-weight:600}
.task-a{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.task textarea{margin-top:10px}
.callout{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);font-size:13.5px;color:var(--ink2)}
.callout.ok{background:var(--ok-bg);border-color:transparent;color:var(--ink2)}.callout.ok b{color:var(--ok)}
.callout.warn{background:var(--warn-bg);border-color:transparent}.callout.warn b{color:var(--warn)}
.answ{margin-top:10px;padding:9px 12px;border-radius:10px;background:var(--acc-bg);font-size:13.5px;color:var(--ink2)}.answ b{color:var(--acc)}
.task.done{opacity:.72;box-shadow:none}.task.done:hover{opacity:1}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.miss{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:6px 14px;align-items:baseline;padding:14px 18px;border-top:1px solid var(--line)}
.miss:first-child{border-top:0}.miss .d{font:500 13px var(--fm);color:var(--mut)}.miss .m b{display:block;font-weight:600}.miss .m span{display:block;font-size:12.5px;color:var(--mut)}
.miss .a{font-weight:600;text-align:right}.miss .x{grid-column:2/-1;display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.miss.sent{background:var(--ok-bg)}.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:var(--sunk);border-radius:0 0 16px 16px}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 18px}
details.fold>summary::-webkit-details-marker{display:none}details.fold>summary h2{flex:1}
details.fold>summary .chev{transition:transform .15s}details.fold[open]>summary .chev{transform:rotate(90deg)}
details.fold>.in{padding:0 18px 18px}
details.mini>summary{cursor:pointer;color:var(--acc);font-size:13.5px;margin-top:10px}details.mini[open]>summary{margin-bottom:8px}
.chat{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.msg{max-width:88%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.msg b{display:block;font:600 11px/1.6 var(--fm);text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.msg.me{align-self:flex-end;background:var(--acc-bg);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--sunk);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.ai.ok{background:var(--ok-bg);border-color:transparent}.msg.ai.ok b{color:var(--ok)}.msg.ai.q{background:var(--warn-bg);border-color:transparent}.msg.ai.q b{color:var(--warn)}
.msg.nova{animation:fade .35s ease-out both}
.st-l{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--mut)}.st-l.ok{color:var(--ok)}.st-l.warn{color:var(--warn)}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--acc);display:inline-block;animation:blik 1.1s ease-in-out infinite}
/* AI účetní na tom pracuje – duha (Franta 3. 11.: „vyznač to mnohem líp, třeba tou duhovou, ať vidím, že se něco děje“) */
@property --uhel{syntax:'<angle>';inherits:false;initial-value:0deg}
.task.ai-prace{border:2px solid transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,
  conic-gradient(from var(--uhel),#ff5f6d,#ffc371,#47cd89,#3fb8ff,#8e7bff,#ff5fd2,#ff5f6d) border-box;
  box-shadow:0 10px 30px -14px rgba(142,123,255,.55);animation:duha 3s linear infinite}
.miss.ai-prace{position:relative;background:linear-gradient(90deg,rgba(255,95,109,.09),rgba(255,195,113,.05) 25%,rgba(63,184,255,.05) 60%,rgba(142,123,255,.09))}
.miss.ai-prace::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:5px;border-radius:0 5px 5px 0;
  background:linear-gradient(180deg,#ff5f6d,#ffc371,#47cd89,#3fb8ff,#8e7bff,#ff5fd2);background-size:100% 300%;animation:duha-pruh 2.4s linear infinite}
@keyframes duha{to{--uhel:360deg}} @keyframes duha-pruh{to{background-position:0 300%}}
.duha-tecka{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block;background:conic-gradient(#ff5f6d,#ffc371,#47cd89,#3fb8ff,#8e7bff,#ff5fd2,#ff5f6d);
  -webkit-mask:radial-gradient(circle,transparent 3px,#000 3.5px);mask:radial-gradient(circle,transparent 3px,#000 3.5px);animation:toc 1.1s linear infinite}
@keyframes toc{to{transform:rotate(360deg)}}
.duha-text{font-weight:650;background:linear-gradient(90deg,#ff5f6d,#ffb020,#2fbf71,#3fb8ff,#8e7bff,#ff5fd2,#ff5f6d);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:duha-text 2.6s linear infinite}

  if(!window.DecompressionStream||!crypto.subtle){$('#chyba').textContent='Starý prohlížeč – aktualizuj ho (Safari / iOS 16.4+, Chrome).';return}
  $('#chyba').textContent='Ověřuji…'; const n=await otevri(hs);
  if(!n){ try{localStorage.removeItem('fdu_heslo')}catch(e){} $('#chyba').textContent=tichy?'':'Špatné heslo.'; return }
  KLIC=await crypto.subtle.importKey('raw',n[1],'AES-GCM',false,['decrypt']);
  const b=b64(BALIK), pl=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},KLIC,b.slice(12));
  D=JSON.parse(await new Response(new Blob([pl]).stream().pipeThrough(new DecompressionStream('gzip'))).text()); UZ=n[0];
  try{ if($('#pamatuj').checked) localStorage.setItem('fdu_heslo',hs) }catch(e){}
  try{POZN=JSON.parse(localStorage.getItem('fdu_pozn_'+UZ)||'[]')}catch(e){POZN=[]}
  HS=hs; PRIHLASEN_T=Math.floor(Date.now()/1000); nactiZive(); document.body.classList.toggle('cteni',UZ==='mama');   // máma jen čte
  $('#login').classList.add('skryt'); $('#app').classList.remove('skryt'); $('#chyba').textContent='';
  try{ vykresli(UZ==='lenka'?'lenka':'prehled'); lista(); spojeni(); hlidejVerzi(); synchronizuj() }
  catch(e){ $('#app').innerHTML='<p class="bad" style="padding:24px">Web se nepodařilo zobrazit: '+esc(e.message)+'</p><p style="padding:0 24px"><button class="btn" onclick="odhlas()">Odhlásit</button></p>' }
}
function odhlas(){ try{localStorage.removeItem('fdu_heslo')}catch(e){} location.replace(location.pathname) }
$('#prihlasit').onclick=()=>prihlas(); $('#hs').addEventListener('keydown',e=>{if(e.key==='Enter')prihlas()});
(()=>{ let h='';   // osobní odkaz …/#k=<heslo> přihlásí a heslo z adresy hned smaže; jinak zapamatované heslo
  if(location.hash.startsWith('#k=')){ h=decodeURIComponent(location.hash.slice(3)); history.replaceState(null,'',location.pathname+location.search) }
  if(!h) try{h=localStorage.getItem('fdu_heslo')||''}catch(e){}
  if(h) prihlas(h,true) })();
async function otevriDoklad(klic,nazev){
  $('#mtit').textContent=nazev; $('#mobsah').innerHTML='<p class="mut" style="padding:16px">Dešifruji…</p>'; $('#modal').style.display='flex';
  try{ const r=await fetch('doc/'+klic+'.bin?v='+encodeURIComponent(BALIK_AKT.slice(0,12)),{cache:'no-store'}); const b=new Uint8Array(await r.arrayBuffer());
    const pl=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},KLIC,b.slice(12)));
    const nl=pl.indexOf(10), typ=new TextDecoder().decode(pl.slice(0,nl)), url=URL.createObjectURL(new Blob([pl.slice(nl+1)],{type:typ}));
    $('#mobsah').innerHTML=typ.startsWith('image')?`<img src="${url}" alt="">`:`<iframe src="${url}" title="Doklad"></iframe>` }
  catch(e){ $('#mobsah').innerHTML='<p class="bad" style="padding:16px">Doklad se nepodařilo otevřít ('+esc(e.message)+').</p>' } }

$('#mzavrit').onclick=zavriModal; $('#modal').onclick=e=>{if(e.target.id==='modal')zavriModal()};

function pridejPozn(id,text){ if(!text)return; POZN=POZN.filter(p=>p.id!==id); POZN.push({id,text}); ulozPozn(); }
function zaznam(id,text){ POZN=POZN.filter(p=>p.id!==id); POZN.push({id,text,odeslano:1,t:ted()}); ulozPozn(); }
function zrusPozn(id){ const n=POZN.length; POZN=POZN.filter(p=>p.id!==id||p.odeslano); if(POZN.length!==n) ulozPozn() }
const ted=()=>Math.floor(Date.now()/1000);   // co už odešlo rovnou – ať je u věci vidět

/* ---------- most: šifrovaně přes ntfy do Clauda na Macu ---------- */
const bt=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(s)};
function toast(t,chyba){ const e=$('#toast'); e.textContent=t; e.className=chyba?'chyba':''; e.style.display='block'; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display='none',chyba?9000:4500) }
async function sifruj(data){ const k=await crypto.subtle.importKey('raw',b64(D.meta.most.klic),'AES-GCM',false,['encrypt']), iv=crypto.getRandomValues(new Uint8Array(12));
  return [iv,new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,data))] }
async function posli(obsah,soubor){
  if(!D.meta.most||(UZ==='mama'&&obsah.druh!=='sync'&&!(obsah.druh==='faktura'&&obsah.akce==='pdf'))) throw new Error(UZ==='mama'?'jen ke čtení':'most není nastavený');
  const [iv,ct]=await sifruj(new TextEncoder().encode(JSON.stringify(Object.assign({kdo:UZ,kdy:new Date().toLocaleString('cs-CZ'),obdobi:D.meta.obdobi},obsah)))), zprava='fdu1.'+bt(iv)+'.'+bt(ct);
  let telo=null;
  if(soubor){ const [fiv,fct]=await sifruj(new Uint8Array(await soubor.arrayBuffer())); telo=new Uint8Array(12+fct.length); telo.set(fiv); telo.set(fct,12) }
  // stejná šifra dvěma cestami: ntfy (hned, drží ~12 h) + trvalá schránka na Disku (Apps Script, nevyprší) – stačí jedna
  const cesty=[telo?fetch(D.meta.most.url+'?filename=f.bin&message='+encodeURIComponent(zprava),{method:'POST',body:new Blob([telo])})
                    :fetch(D.meta.most.url,{method:'POST',body:zprava})];
  if(D.meta.most.schranka) cesty.push(fetch(D.meta.most.schranka,{method:'POST',body:telo?zprava+'\n'+bt(telo):zprava})
    .then(r=>r.json()).then(o=>({ok:!!o.ok,status:o.chyba||200})));
  const v=await Promise.allSettled(cesty);
  if(!v.some(x=>x.status==='fulfilled'&&x.value.ok)) throw new Error('ntfy '+((v[0].value||{}).status||'nedostupné')) }
function nahraj(k,poRadku){ const i=document.createElement('input'); i.type='file'; i.multiple=true; i.accept='image/*,application/pdf,.xml,.csv,.xlsx,.xls,.doc,.docx,.zip';
  i.onchange=async()=>{ const f=[...i.files]; if(!f.length)return; const velke=f.filter(x=>x.size>14e6);
    if(velke.length){ toast('Soubor je moc velký (max 14 MB): '+velke.map(x=>x.name).join(', ')+'. Pošli ho e-mailem na '+SYSTEM_MAIL+'.',1); return }
    const pozn=k&&k.pozn!=null?k.pozn:prompt('Co to je? (nepovinné – např. „účtenka PHM 5. 10.“, „výpis KB říjen“)',''); if(pozn===null)return;
    toast('Nahrávám '+f.length+'…');
    try{ for(const x of f) await posli(Object.assign({druh:'soubor',nazev:x.name,pozn,typ:/v[yý]pis|\.xml$|\.csv$|^kb_/i.test(x.name+' '+pozn)?'banka':'doklad'},k||{}),x);
      if(poRadku) zaznam(poRadku,'Doklad nahrán: '+f.map(x=>x.name).join(', '));
      toast('Nahráno ('+f.length+'). Zpracuje se do pár minut.'); vykresli(TAB) }
    catch(e){ toast('Nahrát se nepodařilo ('+e.message+'). Pošli to e-mailem na '+SYSTEM_MAIL+'.',1) } };
  i.click() }
async function komentar(k){ const t=prompt((k&&k.otazka)||'Napiš poznámku pro AI účetní (přijde rovnou na Mac):',''); if(!t)return;
  try{ await posli(Object.assign({druh:'komentar',text:t},k||{})); if(k&&k.k_platbe) zaznam('komentar-'+k.k_platbe,'Komentář: '+t); toast('Posláno AI účetní.'); vykresli(TAB) }
  catch(e){ pridejPozn('komentar-'+((k&&k.k_platbe)||Date.now().toString(36)),t); toast('Teď se to poslat nepodařilo – je to dole v poznámkách, zkus Odeslat.',1) } }
async function vyres(id){ const a=D.analyza.find(x=>x.id===id); if(!a)return;
  const pozn=prompt('Pošlu to Claudovi a začneme to řešit spolu:\n„'+a.titulek+'“\n\nChceš k tomu něco dodat? (nepovinné)',''); if(pozn===null)return;

  catch(e){ pridejPozn('vyres-'+a.id,'VYŘEŠ TO SE MNOU: '+a.titulek+(pozn?' – '+pozn:'')); toast('Teď se to poslat nepodařilo – je to dole v poznámkách, zkus Odeslat.',1) } }

/* ---------- živě: odpovědi AI účetní chodí hned (ntfy SSE, zpráva fdr1), nová verze webu se načte sama ---------- */
async function desifrujMost(s){ try{ const [v,iv,ct]=s.trim().split('.'); if(v!=='fdr1')return null;
  const k=await crypto.subtle.importKey('raw',b64(D.meta.most.klic),'AES-GCM',false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(iv)},k,b64(ct)))) }catch(e){return null} }
function nactiZive(){ try{ZIVE=JSON.parse(localStorage.getItem('fdu_zive_'+UZ)||'{}')}catch(e){ZIVE={}}
  for(const k in ZIVE){ ZIVE[k]=ZIVE[k].filter(z=>z.t>=(D.meta.sestaveno||0)); if(!ZIVE[k].length)delete ZIVE[k] } }   // starší už jsou ve webu
function ulozZive(){ try{localStorage.setItem('fdu_zive_'+UZ,JSON.stringify(ZIVE))}catch(e){} }
function spojeni(){ if(!D.meta.most||!window.EventSource)return; try{ES&&ES.close()}catch(e){}
  ES=new EventSource(D.meta.most.url+'/sse?since='+(D.meta.sestaveno||'2h'));
  ES.onopen=()=>{ZIVE_OK=true;indikator()}; ES.onerror=()=>{ZIVE_OK=false;indikator()};
  ES.onmessage=async e=>{ let m; try{m=JSON.parse(e.data)}catch(x){return} if(m.event!=='message'||!String(m.message||'').startsWith('fdr1.'))return;
    const o=await desifrujMost(m.message); if(o) prijmi(o,m.attachment) } }
function indikator(){ document.querySelectorAll('.live').forEach(e=>{ e.classList.toggle('on',ZIVE_OK); e.querySelector('span').textContent=ZIVE_OK?'Živě s AI účetní':'Offline' }) }
function pridejZive(id,z){ const a=ZIVE[id]=ZIVE[id]||[]; if(a.some(x=>x.t===z.t&&x.text===z.text&&x.typ===z.typ))return false; a.push(z); return true }
function prijmi(o,priloha){ const t=o.t||ted(), cerstve=t>=PRIHLASEN_T-5;
  if(o.typ==='web'){ hlidejVerzi(true); return }
  if(o.typ==='faktura'){ if(cerstve) fakturaOdpoved(o,priloha); return }
  let nove=false;
  if(o.typ==='prijato') (o.ids||[]).forEach(id=>{ nove=pridejZive(String(id),{kdo:'sys',typ:'prijato',t})||nove });
  if(o.typ==='odpoved') nove=pridejZive(String(o.id),{kdo:'ai',text:o.text,stav:o.stav,t,nova:1});
  if(!nove)return; ulozZive();
  if(cerstve){ const t2=o.typ==='prijato'?'AI účetní to má na Macu – zpracovává.':(o.stav==='vyreseno'?'✓ Vyřešeno: ':o.stav==='dotaz'?'AI účetní se ptá: ':'AI účetní: ')+String(o.text||'').slice(0,90);
    toast(t2); if(o.typ==='odpoved'){ cink(); oznam(t2) } }
  prekresli() }
function prekresli(hned){ const a=document.activeElement; if(!hned&&a&&a.tagName==='TEXTAREA'){PREKRESLIT=true;return} PREKRESLIT=false; vykresli(TAB,null,true) }
document.addEventListener('focusout',()=>{ if(PREKRESLIT) setTimeout(()=>{ const a=document.activeElement; if(PREKRESLIT&&!(a&&a.tagName==='TEXTAREA'))prekresli() },700) });
async function zkontrolujVerzi(){ if(!HS||!D)return false; try{
  const t=await (await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'})).text();
  const mb=t.match(/BALIK=("[A-Za-z0-9+\/=]*")/), mu=t.match(/const UCTY=(\{.*?\}), BALIK=/s); if(!mb||!mu)return false;
  const nb=JSON.parse(mb[1]); if(nb===BALIK_AKT)return false;
  const nu=JSON.parse(mu[1]), n=await otevri(HS,nu); if(!n)return false;
  const klic=await crypto.subtle.importKey('raw',n[1],'AES-GCM',false,['decrypt']), b=b64(nb), pl=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},klic,b.slice(12));
  D=JSON.parse(await new Response(new Blob([pl]).stream().pipeThrough(new DecompressionStream('gzip'))).text()); KLIC=klic; BALIK_AKT=nb; UCTY_AKT=nu;
  nactiZive(); ulozZive(); prekresli(); toast('Web je aktualizovaný.'); return true }catch(e){return false} }
let HLIDAC=null;
function synchronizuj(){   // data starší než 20 min → Mac stáhne FakturaOnline a banku a web se do minuty sám obnoví (Franta 3. 11.)
  if(!D.meta.most||!D.meta.sestaveno||ted()-D.meta.sestaveno<1200)return;
  posli({druh:'sync'}).then(()=>{ toast('Načítám čerstvá data z banky a FakturaOnline…'); hlidejVerzi(true) }).catch(()=>{}) }
function hlidejVerzi(hned){ if(hned){ let i=0; const zkus=async()=>{ if(await zkontrolujVerzi()||++i>8)return; setTimeout(zkus,20000) }; setTimeout(zkus,12000); return }
  if(!HLIDAC) HLIDAC=setInterval(()=>{ if(document.visibilityState==='visible') zkontrolujVerzi() },90000) }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&D){ zkontrolujVerzi(); if(ES&&ES.readyState===2) spojeni() } });

/* ---------- rozhovor u položky: Franta / Lenka ↔ AI účetní (vlákno z webu + živé zprávy + co jsem odeslal) ---------- */
const JMENA={franta:'Franta',lenka:'Lenka'};
const idsF=x=>[x.pozn_id,x.id,...(x.spojene||[]),x.vyres_id].filter(Boolean).map(String);
const idsR=r=>[r.otazka_id,'doklad-'+r.id,'nebude-'+r.id,'soukrome-'+r.id,'komentar-'+r.id];
function vlakno(ids,x){ let ev=[];
  ids.forEach(id=>{ ((D.vlakna||{})[id]||[]).forEach(z=>ev.push(z)); (ZIVE[id]||[]).forEach(z=>ev.push(z)) });
  POZN.filter(p=>p.odeslano&&ids.includes(p.id)).forEach(p=>ev.push({kdo:UZ,text:p.text,t:p.t||1}));
  if(x&&x.odpoved&&!ev.some(z=>z.kdo!=='ai'&&z.kdo!=='sys')) ev.push({kdo:'franta',text:x.odpoved,t:0});
  if(x&&x.dotaz&&!ev.some(z=>z.kdo==='ai')) ev.push({kdo:'ai',text:x.dotaz,stav:'dotaz',t:.5});
  ev.sort((a,b)=>a.t-b.t); const v=new Set();
  return ev.filter(z=>{ const k=z.typ==='prijato'?'p|'+z.t:(z.kdo==='ai'?'ai|':'u|')+z.text; if(v.has(k))return false; v.add(k); return true }) }
function stavV(ev){ const l=[...ev].reverse().find(z=>z.typ!=='prijato'); if(!l)return 'nova';
  if(l.kdo==='ai') return l.stav==='vyreseno'?'hotovo':l.stav==='dotaz'?'dotaz':'ai';
  return ev.some(z=>z.typ==='prijato'&&z.t>=l.t)?'prijato':'ceka' }
const naTobe=s=>s==='nova'||s==='dotaz', stavF=x=>stavV(vlakno(idsF(x),x)), stavR=r=>stavV(vlakno(idsR(r),r));
const STAVY={ceka:'Odesláno – čeká na AI účetní',prijato:'AI účetní na tom právě pracuje…',ai:'AI účetní odpověděla – můžeš doplnit',dotaz:'AI účetní se ptá – odpověz níže',hotovo:'Vyřešeno'};
function chat(ev){ const m=ev.filter(z=>z.typ!=='prijato'&&z.text);
  return m.length?`<div class="chat">${m.map(z=>`<div class="msg ${z.kdo==='ai'?'ai'+(z.stav==='vyreseno'?' ok':z.stav==='dotaz'?' q':''):'me'}${z.nova?' nova':''}"><b>${z.kdo==='ai'?'AI účetní':z.kdo===UZ?'Ty':esc(JMENA[z.kdo]||z.kdo)}</b>${esc(z.text)}</div>`).join('')}</div>`:'' }
const stavRadek=s=>!STAVY[s]?'':s==='prijato'?`<p class="st-l"><span class="duha-tecka"></span><span class="duha-text">${STAVY[s]}</span></p>`
  :`<p class="st-l ${s==='hotovo'?'ok':s==='dotaz'?'warn':''}">${s==='hotovo'?ico('check'):s==='ceka'?ico('clock'):''}${STAVY[s]}</p>`;
function skladac(id,ph){ const d=(POZN.find(p=>p.id===id&&!p.odeslano)||{}).text||'';
  return `<div class="comp"><textarea rows="2" placeholder="${ph}" oninput="pis('${js(id)}',this)" aria-label="Odpověď">${esc(d)}</textarea><button class="btn pri poslat" onclick="posliJednu('${js(id)}',this)" ${d?'':'disabled'}>Odeslat</button></div>` }
function pis(id,el){ const t=el.value.trim(); if(t)pridejPozn(id,t); else zrusPozn(id); const b=el.parentElement.querySelector('.poslat'); if(b)b.disabled=!t }
async function posliJednu(id,btn){ const p=POZN.find(x=>x.id===id&&!x.odeslano); if(!p)return; btn.disabled=true; btn.textContent='Odesílám…';
  try{ await posli({druh:'poznamky',polozky:[{id:p.id,text:p.text}]}); p.odeslano=1; p.t=ted(); ulozPozn(); toast('Odesláno – AI účetní to má na Macu do pár sekund.'); prekresli(true) }
  catch(e){ btn.disabled=false; btn.textContent='Odeslat'; toast('Teď se to poslat nepodařilo ('+e.message+'). Odpověď zůstává dole v liště – zkus Odeslat.',1) } }

function nastOtevri(){ const seg=(k,moz)=>`<div class="seg">${moz.map(([v,n])=>`<button class="${NAST[k]===v?'on':''}" onclick="nastav('${k}','${v}')">${n}</button>`).join('')}</div>`;

function cink(){ if(!NAST.zvuk)return; try{ const a=new (window.AudioContext||window.webkitAudioContext)(), t=a.currentTime;
  [[880,0],[1320,.09]].forEach(([f,d])=>{ const o=a.createOscillator(), g=a.createGain(); o.frequency.value=f; o.type='sine';
    g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(.12,t+d+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d+.35);
    o.connect(g).connect(a.destination); o.start(t+d); o.stop(t+d+.4) }) }catch(e){} }

/* časová osa měsíce – podpis webu: pohyby v bance jako klipy ve střihu, DNES jako playhead, termín DPH jako značka */
function osa(){ const m=D.meta, [r,mm]=m.obdobi.split('-').map(Number), od=new Date(r,mm-1,1), konec=new Date(r,mm+1,0), N=Math.round((konec-od)/864e5)+1;
  const W=1000,H=178,Y=96,L=26,R=974, den=s=>{const [a,b,c]=s.split('-').map(Number);return Math.round((new Date(a,b-1,c)-od)/864e5)}, X=d=>L+(d+.5)/N*(R-L);
  const B=D.banka.map((b,i)=>Object.assign({i},b)).filter(b=>{const d=den(b.datum);return d>=0&&d<N}), max=Math.max(...B.map(b=>Math.abs(b.castka)),1);
  const po={}; B.forEach(b=>(po[b.datum]=po[b.datum]||[]).push(b));
  let s=''; const dalsi=den(`${new Date(r,mm,1).getFullYear()}-${String(new Date(r,mm,1).getMonth()+1).padStart(2,'0')}-01`);
  s+=`<rect x="${(X(dalsi)-(R-L)/N/2).toFixed(1)}" y="22" width="${(R-X(dalsi)+(R-L)/N/2).toFixed(1)}" height="${H-48}" rx="8" fill="var(--sunk)"/>`;
  s+=`<line x1="${L}" x2="${R}" y1="${Y}" y2="${Y}" stroke="var(--line2)"/>`;
  [od,new Date(r,mm,1)].forEach(z=>{ [1,10,20].forEach(dn=>{ const d=Math.round((new Date(z.getFullYear(),z.getMonth(),dn)-od)/864e5), x=X(d);
    s+=`<line x1="${x}" x2="${x}" y1="${H-30}" y2="${H-25}" stroke="var(--line2)"/><text x="${x}" y="${H-10}" text-anchor="middle">${dn===1?'1. '+['LED','ÚNO','BŘE','DUB','KVĚ','ČVN','ČVC','SRP','ZÁŘ','ŘÍJ','LIS','PRO'][z.getMonth()]:dn+'.'}</text>` }) });
  s+=`<text x="${R-6}" y="${H-34}" text-anchor="end">měsíc podání</text>`;
  Object.values(po).forEach(arr=>{ const x0=X(den(arr[0].datum)), w=3.6, g=1.6, n=arr.length;
    arr.forEach((b,k)=>{ const x=x0+(k-(n-1)/2)*(w+g)-w/2, h=4+58*Math.sqrt(Math.abs(b.castka)/max), up=b.castka>0, c=b.pravidlo==='bez-dokladu'?'t-miss':up?'t-in':'t-out';
      s+=`<rect class="tk ${c} ${up?'up':'dn'}" x="${x.toFixed(1)}" y="${(up?Y-h:Y+1).toFixed(1)}" width="${w}" height="${h.toFixed(1)}" rx="1.3" style="animation-delay:${Math.round(x/W*650)}ms" data-i="${b.i}"><title>${esc(dk(b.datum)+' · '+b.text+' · '+kc(b.castka))}</title></rect>` }) });
  D.kalendar.forEach(k=>{ const d=den(k.datum); if(d<0||d>=N)return; const x=X(d), lab=/DPH/.test(k.co)?'DPH':k.co.split(' ')[0];
    const tw=(lab.length+dk(k.datum).length+1)*6.4+16;
    s+=`<line x1="${x}" x2="${x}" y1="30" y2="${H-30}" stroke="var(--warn)" stroke-dasharray="3 3"/><rect x="${x-tw/2}" y="10" width="${tw}" height="18" rx="9" fill="var(--warn-bg)"/><text class="tp" x="${x}" y="23" text-anchor="middle" style="fill:var(--warn)">${esc(lab)} ${dk(k.datum)}</text>` });
  const dd=den(m.stav_k); if(dd>=0&&dd<N){ const x=X(dd);
    s+=`<line class="ph-line" x1="${x}" x2="${x}" y1="30" y2="${H-30}"/><rect x="${x-21}" y="10" width="42" height="18" rx="9" fill="var(--rec)"/><circle class="ph-dot" cx="${x-12}" cy="19" r="2.6" fill="#fff"/><text class="tp" x="${x+4}" y="23" text-anchor="middle" style="fill:#fff">DNES</text>` }
  const vM=B.filter(b=>b.datum.slice(0,7)===m.obdobi), pri=vM.filter(b=>b.castka>0).reduce((a,b)=>a+b.castka,0), vyd=vM.filter(b=>b.castka<0).reduce((a,b)=>a+b.castka,0), bez=vM.filter(b=>b.pravidlo==='bez-dokladu').length;
  const cls=OSA_HOTOVO?'osa static':'osa'; OSA_HOTOVO=true;
  return `<div class="osa-h"><div><h2>${esc(m.obdobi_nazev[0].toUpperCase()+m.obdobi_nazev.slice(1))} v bance</h2><p class="mut sm" style="margin-top:2px">Příjmy <b class="ok num">${kc(pri)}</b> · výdaje <b class="num">${kc(vyd)}</b>${bez?` · <b class="warn">${bez} bez dokladu</b>`:''}</p></div>

  ${DOKF==='vyrazene'?'<p class="mut sm" style="margin:0 0 10px">Tyhle doklady nejsou v účetnictví ani v DPH – u každého je důvod. Když nesouhlasíš, klikni „Zařadit zpět“.</p>':''}

function dokSeznam(){ const q=bezDiak(HLED).trim(), shoda=(...t)=>!q||t.some(x=>bezDiak(x).includes(q)||bezDiak(String(x).replace(/\s/g,'')).includes(q.replace(/\s/g,'')));

      <div class="s">${d.v_dph?`<span class="chip ok">v DPH ${esc(d.sekce||'')}</span><span class="num">${kc(d.zaklad)} + ${kc(d.dan)}</span>`:`<span class="chip">${esc(d.rezim)}</span>${d.duvod?`<span class="mut"> ${esc(d.duvod)}</span>`:''}`}
        <br>${d.uhrazeno?`<span class="ok">zaplaceno ${dk(d.uhrazeno)}</span>`:vyd?'<span class="mut">čeká na platbu</span>':'<span class="warn">platba nenalezena</span>'}</div>

  else if(DOKF==='banka'){
    rows=D.banka.filter(b=>shoda(b.text,b.castka,b.co)).map(b=>`<div class="drow bk"><span class="d">${dk(b.datum)}</span><div class="m"><b>${esc(b.text)}</b></div>

let FAKF='vse', FAKP='oba', FAKR='', FAKH='', FAKN=40, FAKD=null, FORM=null, FAK_CEKA={};
const FK=()=>D.fakturace||{faktury:[],odberatele:[],profily:{},designy:[],statistiky:{},zkouska:{}};
const PROF=k=>(FK().profily||{})[k]||{kod:k,stitek:k==='firma'?'Firma':'IČO',barva:'#7A8699',nazev:k,platce:k==='firma'};
const profTag=(k,dlouhy)=>{ const p=PROF(k); return `<span class="ptag" style="--pc:${p.barva}">${esc(p.stitek)}${dlouhy?' · '+(p.platce?'s DPH':'bez DPH'):''}</span>` };
const castkaF=x=>x.mena!=='CZK'?(+x.celkem).toLocaleString('cs-CZ',{maximumFractionDigits:2})+' '+esc(x.mena):kc(x.celkem);
const stavFak=x=>x.druh==='dobropis'?['dob','Dobropis']:x.stav==='stornovana'?['dob','Stornováno']:x.stav==='zaplacena'?['ok','Zaplaceno']:x.zaplaceno_cast?[x.po_splatnosti?'bad':'warn','Částečně zaplaceno']:x.po_splatnosti?['bad','Po splatnosti']:['warn','Čeká na platbu'];
// zaplaceno podle Franty, ale výpis z banky (KB jednou za měsíc) to zatím nepotvrdil
const fakBanka=x=>x.ceka_banka?`<span class="cb" title="Zaplaceno podle tebe, výpis z banky to zatím nepotvrdil – potvrdí se sám, až přijde.">čeká na výpis banky</span>`:'';
const FSTAV=[['vse','Vše'],['nez','Nezaplacené'],['po','Po splatnosti'],['zapl','Zaplacené'],['dob','Dobropisy a storna']];
function fakFiltr(x,bez){
  if(bez!=='stav'){ if(FAKF==='nez'&&!(x.druh==='faktura'&&x.stav==='vystavena'))return false; if(FAKF==='po'&&!x.po_splatnosti)return false;
    if(FAKF==='zapl'&&!(x.druh==='faktura'&&x.stav==='zaplacena'))return false; if(FAKF==='dob'&&!(x.druh==='dobropis'||x.stav==='stornovana'))return false }
  if(bez!=='prof'&&FAKP!=='oba'&&x.profil!==FAKP)return false;
  if(bez!=='rok'&&FAKR&&(x.datum||'').slice(0,4)!==FAKR)return false;
  const q=bezDiak(FAKH).trim(); if(!q)return true;
  const kde=bezDiak([x.cislo,x.odberatel,x.ico,x.celkem,String(x.celkem).replace('.',','),PROF(x.profil).stitek,x.mena,(x.polozky||[]).map(p=>p[0]).join(' ')].join(' '));
  return q.split(/\s+/).every(w=>kde.includes(w)) }
function fakNastav(k,v){ if(k==='stav')FAKF=v; if(k==='prof')FAKP=v; if(k==='rok')FAKR=v; FAKN=40; $('#fvysl').innerHTML=fakVysledky(); fakSegy() }
const fakPocet=k=>{ const o=FAKF; FAKF=k; const n=FK().faktury.filter(x=>fakFiltr(x)).length; FAKF=o; return n };
function fakSegy(){ document.querySelectorAll('#fseg-stav button').forEach(b=>{ const k=b.dataset.k; b.classList.toggle('on',k===FAKF); b.querySelector('span').textContent=fakPocet(k) });
  document.querySelectorAll('#fseg-prof button').forEach(b=>b.classList.toggle('on',b.dataset.k===FAKP)) }

/* ---------- POJISTKA – zkouška po každé operaci (Franta 3. 11.: „tady se nemůže stát chyba… pojistka na všechny operace“) ---------- */
const casZk=s=>s?dk(s.slice(0,10))+' '+s.slice(11,16):'';
const POJ=()=>D.pojistka||{};
const MES_N=['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];
const obdN=o=>o?MES_N[+o.slice(5,7)-1]+' '+o.slice(0,4):'';
const pojSkupiny=jen=>(POJ().skupiny||[]).filter(g=>!jen||jen.includes(g.kod));
const pojChyby=jen=>pojSkupiny(jen).flatMap(g=>g.kontroly.flatMap(k=>k.chyby));
function pojKarta(){ const z=POJ(); if(!z.kontrol)return ''; const ch=pojChyby().slice(0,3);
  return `<section class="card sec pojk ${z.ok?'ok':'bad'}" onclick="pojDetail()" onkeydown="if(event.key==='Enter')pojDetail()" role="button" tabindex="0" aria-label="Pojistka – detail">
    <span class="pojic">${ico(z.ok?'shield':'x')}</span>
    <div class="pojt"><b>${z.ok?`Pojistka: všech ${z.kontrol} kontrol sedí`:`Pojistka nesedí – ${sklon(z.chyb,'chyba','chyby','chyb')}`}</b>
      <span>${z.ok?`Každé číslo spočítané podruhé jinou cestou – faktury, účetnictví ${esc(obdN(z.obdobi))}, DPH a KH, banka, doklady.`:ch.map(esc).join(' · ')}</span></div>
    <span class="pojc">${casZk(z.cas)}${z.upozorneni?`<br>${sklon(z.upozorneni,'upozornění','upozornění','upozornění')}`:''}</span>${ico('chev')}</section>` }
function zkChip(){ const gs=pojSkupiny(['faktury','statistiky']); if(!gs.length)return ''; const k=gs.flatMap(g=>g.kontroly), ch=pojChyby(['faktury','statistiky']).length, ok=!ch;
  return `<button class="zk ${ok?'ok':'bad'}" onclick="pojDetail(['faktury','statistiky'])" title="Co se kontroluje">${ico(ok?'shield':'x')}<b>${ok?`Pojistka faktur sedí – ${k.length} z ${k.length} kontrol`:`Pojistka faktur nesedí – ${sklon(ch,'chyba','chyby','chyb')}`}</b><span>${casZk(POJ().cas)}</span>${ico('chev')}</button>` }
function zkBanner(){ const ch=pojChyby(['faktury','statistiky']); if(!ch.length)return '';
  return `<div class="callout bad-c"><b>Čísla faktur neprošla zkouškou – neber je zatím jako hotová.</b><ul>${ch.slice(0,3).map(c=>`<li>${esc(c)}</li>`).join('')}</ul><a onclick="pojDetail(['faktury','statistiky'])">Celá zkouška</a></div>` }
function zkFoBlok(){ const z=FK().zkouska||{}, ods=(z.odsouhlaseni||[]).slice().sort((a,b)=>(b.rok+a.profil).localeCompare(a.rok+b.profil)); if(!ods.length)return '';
  return `<h3 class="pojh">Archiv FakturaOnline × naše čísla</h3><p class="mut sm">Rozdíl proti FakturaOnline je vysvětlený doklad po dokladu.</p>
    ${ods.map(o=>`<div class="kart" style="margin-top:8px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">${profTag(o.profil)} <b>${o.rok}</b>
      <span class="sm">FakturaOnline <b class="num">${kc(o.fakturaonline_czk)}</b> → u nás <b class="num">${kc(o.statistiky_czk)}</b>${o.rozdil_czk?` <span class="mut">(${o.rozdil_czk>0?'+':''}${kc(o.rozdil_czk)})</span>`:''}</span></div>
      ${(o.doklady||[]).length?`<details class="mini"><summary>Co dělá rozdíl (${o.doklady.length})</summary>${o.doklady.map(d=>`<div class="kv"><span>${esc(d.cislo)} · ${esc(d.odberatel||'')}<br><span class="mut xs">${esc(d.duvod)}</span></span><span class="num">${d.czk==null?'—':kc(d.czk)}</span></div>`).join('')}</details>`:'<p class="mut xs" style="margin-top:6px">Sedí přesně.</p>'}</div>`).join('')}` }
function pojDetail(jen){ const z=POJ(), gs=pojSkupiny(jen);
  $('#fak').innerHTML=`<div class="sheet w" role="dialog" aria-modal="true" aria-label="Pojistka"><div class="sheet-h"><h2>Pojistka${jen?' – faktury':''}</h2><button class="ibtn" onclick="fakZavri()" aria-label="Zavřít">${ico('x')}</button></div>
    <p class="mut sm">Jako zkouška ve škole: po každé operaci systém zkontroluje, že se stalo přesně to, co mělo. Jednoduché věci (zaplaceno, smazání, odeslání) mají <b>základní kontrolu</b>, složité (faktura, zaúčtování měsíce, DPH a KH, statistiky) <b>plnou zkoušku</b> – výsledek se spočítá podruhé jinou cestou a musí sedět na haléř. Faktura, která zkouškou neprojde, se neodešle. Poslední velká zkouška ${casZk(z.cas)}${z.obdobi?` (účetnictví ${esc(obdN(z.obdobi))})`:''}.</p>
    ${gs.map(g=>`<h3 class="pojh">${esc(g.nazev)}</h3><div class="zkl">${g.kontroly.map(k=>`<div class="zkk ${k.ok?'ok':'bad'}">${ico(k.ok?'check':'x')}<div><b>${esc(k.nazev)}</b><span>${k.uroven==='plna'?'plná zkouška – dvě nezávislé cesty':'základní kontrola'}</span>
      ${k.chyby.map(c=>`<span class="bad">${esc(c)}</span>`).join('')}
      ${k.upozorneni.length?`<details class="mini"><summary>${sklon(k.upozorneni.length,'upozornění','upozornění','upozornění')} (čísla nemění)</summary>${k.upozorneni.map(u=>`<span>${esc(u)}</span>`).join('')}</details>`:''}</div></div>`).join('')}</div>`).join('')}
    ${!jen||jen.includes('statistiky')?zkFoBlok():''}
  </div>`; $('#fak').classList.add('on') }

function faktury(){ const F=FK(), ja=UZ==='franta', rok=String(new Date().getFullYear()), st=F.statistiky||{};
  const ob=k=>((st[k]||{}).roky||{})[rok]||{}, nez=(st.oba||{}).nezaplaceno||{}, pos=(st.oba||{}).po_splatnosti||{};
  const roky=Object.keys((st.oba||{}).roky||{}).sort().reverse(), top=(st.oba||{}).top||[], maxT=Math.max(...top.map(t=>t.obrat||0),1);
  const rokyF=[...new Set(F.faktury.map(x=>(x.datum||'').slice(0,4)).filter(Boolean))].sort().reverse();
  return `<header class="ph"><div><div class="eyebrow">Vlastní fakturace · bez FakturaOnline</div><h1>Faktury</h1><p class="sub">Vystavíš tady, Mac fakturu vytvoří, zapíše do účetnictví a pošle e-mailem z honza@. Klikni na fakturu a uvidíš všechno, co s ní jde udělat.</p></div>
    <div class="ph-act">${ja?`<button class="btn pri" onclick="fakNova()">${ico('plus')}Nová faktura</button>`:''}</div></header>
  ${zkBanner()}
  <section class="card sec money" style="margin-top:0">
    <div><span>${profTag('firma')} ${rok}</span><b>${kc(ob('firma').obrat)}</b><i>${ob('firma').pocet||0} faktur</i></div>
    <div><span>${profTag('osvc')} ${rok}</span><b>${kc(ob('osvc').obrat)}</b><i>${ob('osvc').pocet||0} faktur</i></div>
    <button class="mt" onclick="fakNastav('stav','nez');$('#fvysl').scrollIntoView({behavior:'smooth',block:'start'})"><span>Čeká na platbu</span><b>${kc(nez.castka_czk)}</b><i>${nez.pocet||0} faktur · zobrazit →</i></button>
    <button class="mt" onclick="fakNastav('stav','po');$('#fvysl').scrollIntoView({behavior:'smooth',block:'start'})"><span>Po splatnosti</span><b class="${pos.pocet?'bad':''}">${kc(pos.castka_czk)}</b><i>${pos.pocet||0} faktur · zobrazit →</i></button></section>
  <div class="zkrow">${zkChip()}</div>
  <section class="card sec ffiltr">
    <div class="seg" id="fseg-stav" role="group" aria-label="Stav">${FSTAV.map(([k,n])=>`<button data-k="${k}" class="${k===FAKF?'on':''}" onclick="fakNastav('stav','${k}')">${n}<span>${fakPocet(k)}</span></button>`).join('')}</div>
    <div class="frow2"><div class="seg" id="fseg-prof" role="group" aria-label="Kdo fakturoval">${[['oba','Firma i IČO'],['firma','Firma'],['osvc','IČO']].map(([k,n])=>`<button data-k="${k}" class="${k===FAKP?'on':''}" onclick="fakNastav('prof','${k}')">${k==='oba'?'':`<i class="dot" style="background:${PROF(k).barva}"></i>`}${n}</button>`).join('')}</div>
      <select aria-label="Rok" onchange="fakNastav('rok',this.value)"><option value="">Všechny roky</option>${rokyF.map(y=>`<option ${y===FAKR?'selected':''}>${y}</option>`).join('')}</select>
      <label class="hledej">${ico('search')}<input type="search" placeholder="Hledat odběratele, číslo, částku, položku…" value="${esc(FAKH)}" oninput="FAKH=this.value;FAKN=40;$('#fvysl').innerHTML=fakVysledky();fakSegy()" aria-label="Hledat"></label></div></section>
  <div id="fvysl">${fakVysledky()}</div>
  <div class="grid2 sec" style="align-items:start"><section class="card pad"><div class="sec-h"><h2>Obrat po letech</h2><span class="mut sm">vč. faktur z FakturaOnline</span></div>
    <div class="tbl"><table><tr><th>Rok</th><th class="r">${profTag('firma')}</th><th class="r">${profTag('osvc')}</th><th class="r">Celkem</th></tr>
    ${roky.map(y=>`<tr><td class="mono">${y}</td><td class="r num">${kc((((st.firma||{}).roky||{})[y]||{}).obrat||0)}</td><td class="r num">${kc((((st.osvc||{}).roky||{})[y]||{}).obrat||0)}</td><td class="r num"><b>${kc(((st.oba.roky||{})[y]||{}).obrat||0)}</b></td></tr>`).join('')}</table></div></section>
  <section class="card pad"><div class="sec-h"><h2>Největší odběratelé</h2><span class="mut sm">za celou dobu</span></div>
    ${top.map(t=>`<div style="padding:7px 0;border-top:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:10px;font-size:13.5px"><span>${esc(t.nazev)}</span><span class="num">${kc(t.obrat)}</span></div><div class="bar2" style="width:${Math.max(2,(t.obrat||0)/maxT*100)}%;margin-top:5px"></div></div>`).join('')}</section></div>` }

function fakVysledky(){ const F=FK(), rows=F.faktury.filter(x=>fakFiltr(x));
  const dluh=FAKF==='nez'||FAKF==='po';      // u nezaplacených se sčítá, co zbývá (částečné platby), stejně jako na dlaždicích
  const czk=rows.filter(x=>x.mena==='CZK').reduce((a,x)=>a+(+(dluh&&x.zbyva!=null?x.zbyva:x.celkem)||0),0), ciz={};
  rows.filter(x=>x.mena!=='CZK').forEach(x=>ciz[x.mena]=(ciz[x.mena]||0)+(+x.celkem||0));
  const filtr=FAKF!=='vse'||FAKP!=='oba'||FAKR||FAKH.trim();
  return `<div class="fsum"><span><b>${rows.length}</b> ${rows.length===1?'faktura':rows.length>=2&&rows.length<=4?'faktury':'faktur'} · ${dluh?'zbývá zaplatit':'součet'} <b class="num">${kc(Math.round(czk*100)/100)}</b>${Object.entries(ciz).map(([m,v])=>` + ${v.toLocaleString('cs-CZ',{maximumFractionDigits:2})} ${esc(m)}`).join('')}</span>
    ${filtr?`<a onclick="FAKF='vse';FAKP='oba';FAKR='';FAKH='';FAKN=40;vykresli('faktury',null,true)">Zrušit filtry</a>`:''}</div>
  <div class="card flist"><div class="fhead" aria-hidden="true"><span>Datum</span><span>Odběratel · číslo</span><span>Kdo</span><span class="r">Částka</span><span>Stav</span><span class="r">Akce</span></div>
    ${rows.slice(0,FAKN).map(fakRadek).join('')||`<div class="empty">Nic nenalezeno – zkus jiné slovo nebo zruš filtry.</div>`}</div>
  ${rows.length>FAKN?`<div style="text-align:center;margin-top:10px"><button class="btn" onclick="FAKN+=60;$('#fvysl').innerHTML=fakVysledky()">Zobrazit dalších ${Math.min(60,rows.length-FAKN)} z ${rows.length-FAKN}</button></div>`:''}` }
function fakRadek(x){ const [c,t]=stavFak(x), cek=FAK_CEKA['f'+x.id], ja=UZ==='franta';
  const pod=x.stav==='zaplacena'&&x.uhrazeno?'uhrazeno '+dk(x.uhrazeno):x.druh==='faktura'&&x.stav==='vystavena'?(x.zbyva!=null?'zbývá '+kc(x.zbyva)+' · ':'')+'splatnost '+dk(x.splatnost):'';
  return `<div class="frow s-${c}" onclick="fakDetail(${x.id})" onkeydown="if(event.key==='Enter')fakDetail(${x.id})" tabindex="0" role="button" aria-label="Faktura ${esc(x.cislo)}, ${esc(x.odberatel)}">
    <span class="fd">${dk(x.datum)}<i>${(x.datum||'').slice(0,4)}</i></span>
    <div class="fm"><b>${esc(x.odberatel||'—')}</b><span class="mono">${x.druh==='dobropis'?'Dobropis ':''}${esc(x.cislo)}${x.priznak?' · <em class="warn">mimo statistiky</em>':''}${x.odeslano?' · odesláno':''}</span>${cek?`<span class="cek">${esc(cek)}</span>`:''}</div>
    ${profTag(x.profil)}
    <span class="fa num">${castkaF(x)}</span>
    <span class="fs"><span class="chip ${c}">${t}</span>${pod?`<span>${pod}</span>`:''}${fakBanka(x)}</span>
    <span class="fx" onclick="event.stopPropagation()">${x.ma_pdf||x.pdf||x.zdroj==='system'?`<button class="abtn" onclick="fakPdf(${x.id})" title="Otevřít PDF">${ico('eye')}<span>PDF</span></button>`:''}
      ${ja&&x.druh==='faktura'&&x.stav==='vystavena'?`<button class="abtn" onclick="fakPoslat(${x.id})" title="Poslat e-mailem">${ico('send')}<span>Poslat</span></button>`:''}
      <button class="abtn more" onclick="fakDetail(${x.id})" title="Všechny akce" aria-label="Všechny akce">${ico('chev')}</button></span></div>` }

/* ---------- detail faktury s akcemi ---------- */
function fakDetail(id){ const F=FK(), x=F.faktury.find(f=>f.id===id); if(!x)return; FAKD=id;
  const p=PROF(x.profil), ja=UZ==='franta', [c,t]=stavFak(x), nasa=x.zdroj==='system', jen_dob='Faktura je z FakturaOnline – opravuje se dobropisem.';
  const upr=nasa?x.lze_upravit:jen_dob, sm=nasa?x.lze_smazat:jen_dob, cek=FAK_CEKA['f'+x.id];
  const A=(ikona,text,fn,tr)=>`<button class="btn ${tr||''}" onclick="${fn}">${ico(ikona)}${text}</button>`;
  const akce=[A('eye','Otevřít PDF',`fakPdf(${x.id})`), A('dl','Stáhnout PDF',`fakPdf(${x.id},true)`)];
  if(ja){ if(x.druh==='faktura'&&x.stav==='vystavena') akce.push(A('send','Poslat e-mailem',`fakPoslat(${x.id})`));
    if(x.druh==='faktura') akce.push(A('copy','Duplikovat',`fakDuplikuj(${x.id})`));
    if(x.druh==='faktura'&&x.stav==='vystavena') akce.push(A('check','Označit jako zaplacenou',`fakZaplaceno(${x.id})`));
    if(nasa&&!upr) akce.push(A('pen','Upravit',`fakUprav(${x.id})`));
    if(x.druh==='faktura'&&x.stav!=='stornovana'&&(x.polozky||[]).length) akce.push(A('undo','Stornovat dobropisem',`fakStorno(${x.id})`));
    if(nasa&&!sm) akce.push(A('trash','Smazat',`fakSmaz(${x.id})`,'danger')) }
  const proc=ja?[!nasa||upr?['Upravit',upr]:null, x.druh==='faktura'&&(!nasa||sm)?['Smazat',sm]:null].filter(Boolean):[];
  const pol=x.polozky||[];
  $('#fak').innerHTML=`<div class="sheet w" role="dialog" aria-modal="true" aria-label="Faktura ${esc(x.cislo)}">
    <div class="pband" style="--pc:${p.barva}"><span class="ptag" style="--pc:${p.barva}">${esc(p.stitek)}</span><span><b>${esc(p.nazev)}</b> · IČO ${esc(p.ico||'')} · ${p.platce?'plátce DPH':'neplátce DPH'}</span><button class="ibtn" onclick="fakZavri()" aria-label="Zavřít">${ico('x')}</button></div>
    <div class="dhead"><div><div class="eyebrow">${x.druh==='dobropis'?'Dobropis':'Faktura'} ${esc(x.cislo)}</div><h2>${esc(x.odberatel||'—')}</h2>${x.ico?`<span class="mut sm">IČO ${esc(x.ico)}</span>`:''}</div>
      <div class="r"><b class="dsum num">${castkaF(x)}</b><span class="chip ${c}">${t}</span></div></div>
    ${cek?`<div class="callout">${esc(cek)}</div>`:''}
    ${x.zaplaceno_cast?`<div class="callout">Zaplaceno zatím <b>${kc(x.zaplaceno_cast)}</b>, zbývá <b>${kc(x.zbyva)}</b>.${x.ceka_banka?' Podle tebe – výpis z banky to zatím nepotvrdil.':''}</div>`:x.ceka_banka?`<div class="callout">Zaplacená podle tebe. Výpis z banky to zatím nepotvrdil – až přijde, potvrdí se to samo a datum úhrady se upraví na skutečné.</div>`:''}
    ${x.priznak?`<div class="callout warn-c"><b>Mimo statistiky:</b> ${esc(x.priznak)}</div>`:''}
    <div class="kvs">
      <div class="kv"><span>Vystaveno</span><span>${dk(x.datum)} ${(x.datum||'').slice(0,4)}</span></div>
      ${x.druh==='faktura'?`<div class="kv"><span>Splatnost</span><span class="${x.po_splatnosti?'bad':''}">${dk(x.splatnost)} ${(x.splatnost||'').slice(0,4)}</span></div>`:''}
      ${x.uhrazeno?`<div class="kv"><span>Zaplaceno</span><span class="ok">${dk(x.uhrazeno)} ${x.uhrazeno.slice(0,4)}</span></div>`:''}
      <div class="kv"><span>Odesláno</span><span>${x.odeslano?esc(String(x.odeslano).slice(5,22))+' na '+esc(x.odeslano_komu):nasa?'zatím ne':'mimo náš systém (FakturaOnline / e-mail)'}</span></div>

  if(TAB==='faktury'){ if(FAKD&&fx&&FAKD===fx.id)fakDetail(fx.id); else prekresli(true) } }

/* ---------- ČÍSLA – DPH, výsledek, daň z příjmů, rozvaha ---------- */
function cisla(){ const kh=D.kh, s=r=>r?kc((r.zakl_dane1||0)+(r.zakl_dane2||0)):'—', R=D.rok, dp=D.prehled.dppo, rz=R.rozvaha, t=termDPH(), dph=D.prehled.dph;
  const tot=R.mesice.reduce((a,m)=>({v:a.v+m.vynosy,n:a.n+m.naklady,r:a.r+m.vysledek}),{v:0,n:0,r:0}), maxS=Math.max(...R.skupiny.map(x=>Math.abs(x.castka)),1);
  return hlavicka(esc(D.meta.obdobi_nazev)+' · rok '+D.meta.obdobi.slice(0,4),'Čísla','Přiznání DPH ke stažení, výsledek roku, odhad daně z příjmů a rozvaha.')
  +`<section class="card pad"><div class="sec-h"><div><div class="eyebrow">Přiznání k DPH · ${esc(D.meta.obdobi_nazev)}</div><h2 style="font-size:28px">${dph>=0?'K úhradě':'Vrátí FÚ'} ${kc(Math.abs(dph))}</h2>
      <p style="margin-top:4px">Podat a zaplatit do ${dt(t)}</p></div>
      <div class="ph-act"><button class="btn pri" onclick="stahni('DPHDP3_${D.meta.obdobi}.xml',D.xml.dp3)">${ico('dl')}Přiznání DPH (XML)</button><button class="btn" onclick="stahni('DPHKH1_${D.meta.obdobi}.xml',D.xml.kh)">${ico('dl')}Kontrolní hlášení (XML)</button></div></div>
    <p class="mut sm">XML se nahraje na portál MOJE daně (EPO) → „Načíst ze souboru“ → zkontrolovat → podat. Nic se neodesílá samo.</p>
    ${D.varovani.length?D.varovani.map(v=>`<div class="callout warn"><b>Pozor:</b> ${esc(v)}</div>`).join(''):''}
    <div class="grid2" style="margin-top:16px;align-items:start"><div class="tbl"><table><tr><th>Ř.</th><th>Přiznání</th><th class="r">Kč</th></tr>
      ${D.priznani.map(r=>`<tr${r.klic==='dano_da'?' class="tot"':''}><td class="mono">${esc(r.radek)}</td><td>${esc(r.popis)}</td><td class="r num">${kc(r.castka)}</td></tr>`).join('')}</table></div>
    <div class="tbl"><table><tr><th>Kontrolní hlášení</th><th class="r">Řádků</th><th class="r">Základ</th></tr>
      <tr><td>A.2 – služby ze zahraničí</td><td class="r">${kh.A2.length}</td><td class="r num">${kc(kh.A2.reduce((a,r)=>a+(r.zakl_dane1||0),0))}</td></tr>
      <tr><td>A.4 – vydané nad 10 000 Kč</td><td class="r">${kh.A4.length}</td><td class="r num">${kc(kh.A4.reduce((a,r)=>a+(r.zakl_dane1||0),0))}</td></tr>
      <tr><td>A.5 – vydané do 10 000 Kč</td><td class="r">souhrn</td><td class="r num">${s(kh.A5)}</td></tr>
      <tr><td>B.2 – přijaté nad 10 000 Kč</td><td class="r">${kh.B2.length}</td><td class="r num">${kc(kh.B2.reduce((a,r)=>a+(r.zakl_dane1||0)+(r.zakl_dane2||0),0))}</td></tr>
      <tr><td>B.3 – přijaté do 10 000 Kč</td><td class="r">souhrn</td><td class="r num">${s(kh.B3)}</td></tr></table></div></div></section>

  <section class="card pad sec"><div class="sec-h"><div><h2>Rok ${D.meta.obdobi.slice(0,4)} po měsících</h2><p>Výnosy <b class="ok num">${kc(tot.v)}</b> · náklady <b class="num">${kc(tot.n)}</b> · výsledek <b class="num ${tot.r<0?'bad':'ok'}">${kc(tot.r)}</b></p></div>
    <div class="leg"><span><i style="background:var(--in)"></i>výnosy</span><span><i style="background:var(--out)"></i>náklady</span></div></div>
    ${grafRok()}<p class="mut xs" style="margin-top:8px">Leden–září z Pohody (Lenka), od října zaúčtováno automaticky z dokladů a banky.</p>
    <details class="mini"><summary>Tabulka po měsících</summary><div class="tbl"><table><tr><th>Měsíc</th><th class="r">Výnosy</th><th class="r">Náklady</th><th class="r">Výsledek</th></tr>
    ${R.mesice.map(m=>`<tr><td>${m.mesic}</td><td class="r num">${kc(m.vynosy)}</td><td class="r num">${kc(m.naklady)}</td><td class="r num ${m.vysledek<0?'bad':'ok'}">${kc(m.vysledek)}</td></tr>`).join('')}
    <tr class="tot"><td>Celkem</td><td class="r num">${kc(tot.v)}</td><td class="r num">${kc(tot.n)}</td><td class="r num">${kc(tot.r)}</td></tr></table></div></details></section>

  <div class="grid2 sec" style="align-items:start"><section class="card pad" id="s-dppo"><div class="sec-h"><h2>Daň z příjmů za rok – odhad</h2></div>
    <div class="kv"><span>Výsledek k ${dk(D.meta.stav_k)}</span><span class="num">${kc(dp.vysledek_k_datu)}</span></div>
    <div class="kv"><span>− odpisy majetku do konce roku</span><span class="num">${kc(-dp.plan_odpisu_do_konce_roku)}</span></div>
    <div class="kv b"><span>= výsledek roku</span><span class="num">${kc(dp.vysledek_rok)}</span></div>
    <div class="kv"><span>+ nedaňové náklady</span><span class="num">${kc(dp.nedanove)}</span></div>
    <div class="kv"><span>− daňová ztráta z minulých let</span><span class="num">${kc(-dp.ztrata_minulych_let)}</span></div>
    <div class="kv b"><span>Daň (21 %)</span><span class="num">${kc(dp.dan)}</span></div>
    ${dp.nova_ztrata<0?`<div class="callout">Letos vychází daňová ztráta <b class="num">${kc(dp.nova_ztrata)}</b> – dá se odečíst od zisku v dalších 5 letech. Každá další tržba do konce roku ji jen snižuje (daň zatím 0 Kč).</div>`:''}</section>
  <section class="card pad"><div class="sec-h"><h2>Náklady letos podle druhu</h2></div>
    ${R.skupiny.map(x=>`<div style="padding:7px 0;border-top:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:10px;font-size:13.5px"><span>${esc(x.nazev)}</span><span class="num">${kc(x.castka)}</span></div>
      <div class="hbar" style="width:${Math.max(2,Math.abs(x.castka)/maxS*100)}%;margin-top:5px"></div></div>`).join('')}</section></div>

  <section class="sec"><div class="sec-h"><h2>Rozvaha k ${dt(D.meta.stav_k)}</h2></div><div class="grid2" style="align-items:start">
    <div class="card pad"><h3 style="margin-bottom:6px">Aktiva <span class="mut">– co firma má</span></h3>${rz.aktiva.map(x=>`<div class="kv"><span>${esc(x.nazev)}</span><span class="num">${kc(x.castka)}</span></div>`).join('')}<div class="kv b"><span>Celkem</span><span class="num">${kc(rz.aktiva_celkem)}</span></div></div>
    <div class="card pad"><h3 style="margin-bottom:6px">Pasiva <span class="mut">– z čeho je to financované</span></h3>${rz.pasiva.map(x=>`<div class="kv"><span>${esc(x.nazev)}</span><span class="num ${x.castka<0?'bad':''}">${kc(x.castka)}</span></div>`).join('')}<div class="kv b"><span>Celkem</span><span class="num">${kc(rz.pasiva_celkem)}</span></div></div></div></section>` }
function grafRok(){ const M=D.rok.mesice, W=1000, H=210, T=14, B=H-26, max=Math.max(...M.map(m=>Math.max(m.vynosy,m.naklady)),1), gw=(W-40)/M.length, bw=Math.min(22,gw*.3);
  const y=v=>B-(v/max)*(B-T);
  let s=`<line x1="20" x2="${W-20}" y1="${B}" y2="${B}" stroke="var(--line2)"/>`;
  [.5,1].forEach(f=>{ s+=`<line x1="20" x2="${W-20}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="22" y="${y(max*f)-4}">${Math.round(max*f/1000).toLocaleString('cs-CZ')} tis.</text>` });
  M.forEach((m,i)=>{ const cx=20+gw*i+gw/2;
    s+=`<rect x="${cx-bw-2}" y="${y(m.vynosy)}" width="${bw}" height="${B-y(m.vynosy)}" rx="3" class="t-in"><title>${m.mesic}: výnosy ${kc(m.vynosy)}</title></rect>`;
    s+=`<rect x="${cx+2}" y="${y(m.naklady)}" width="${bw}" height="${B-y(m.naklady)}" rx="3" class="t-out"><title>${m.mesic}: náklady ${kc(m.naklady)}</title></rect>`;
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${m.mesic.slice(0,3)}</text>` });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Výnosy a náklady po měsících">${s}</svg>` }
</script></body></html>
