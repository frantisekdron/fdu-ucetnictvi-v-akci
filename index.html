<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Účetnictví v akci</title>
<style>
:root{--bg:#f5f4f0;--panel:#fff;--line:#e3e0d8;--txt:#1c2228;--mut:#6a7280;--acc:#1f6feb;--ok:#2e8b57;--warn:#b7791f;--bad:#c0392b;--chip:#eef2f7}
@media (prefers-color-scheme:dark){:root{--bg:#101317;--panel:#181d23;--line:#2a313a;--txt:#e7eaee;--mut:#97a1ad;--acc:#58a6ff;--chip:#222a33}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 110px}h1{font-size:22px;margin:0}h2{font-size:18px;margin:22px 0 8px}h3{font-size:15px;margin:16px 0 6px}
.mut{color:var(--mut)}.small{font-size:13px}.r{text-align:right;white-space:nowrap}
#login{max-width:380px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
input,textarea,select{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--txt);color:var(--bg);cursor:pointer;font-weight:600}
button.sec{background:transparent;color:var(--txt);border:1px solid var(--line);font-weight:500}button.mini{padding:3px 9px;font-size:12px;font-weight:500}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}nav button{background:var(--panel);color:var(--txt);border:1px solid var(--line);font-weight:500}
nav button.on{background:var(--txt);color:var(--bg)}
.karty{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.karta{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.karta b.velke{display:block;font-size:24px;margin-top:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{color:var(--mut);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.chip{display:inline-block;background:var(--chip);border-radius:20px;padding:1px 9px;font-size:12px;margin:1px 2px 1px 0}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}a{color:var(--acc);cursor:pointer}
.otazka{border-left:4px solid var(--warn);padding:8px 12px;margin:8px 0;background:var(--panel);border-radius:0 10px 10px 0}
.otazka.PHM{border-color:var(--bad)}.otazka textarea{margin-top:6px;min-height:38px}
#lista{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px;display:none}
#lista .in{max-width:1080px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal .box{background:var(--panel);border-radius:14px;width:min(1000px,100%);height:90vh;display:flex;flex-direction:column;overflow:hidden}
#modal .hl{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
#modal iframe,#modal img{flex:1;border:0;width:100%;object-fit:contain;background:#fff}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.flow .karta h3{margin-top:0}
.bar{height:8px;border-radius:4px;background:var(--acc);display:inline-block;vertical-align:middle}.bar.n{background:var(--warn)}
.skryt{display:none}
</style></head><body>
<div id="login"><h1>Účetnictví v akci</h1><p class="mut">František Dron s.r.o. · přihlas se</p>
<p><input id="jm" placeholder="Jméno (franta / lenka)" autocomplete="username"></p>
<p><input id="hs" type="password" placeholder="Heslo" autocomplete="current-password"></p>
<p><button id="prihlasit">Přihlásit</button> <span id="chyba" class="bad small"></span></p>
<p class="mut small">Data jsou zašifrovaná – bez hesla se nedají přečíst.</p></div>
<div class="wrap skryt" id="app"></div>
<div id="lista"><div class="in"><b id="pocet">0 poznámek</b><span class="mut small" id="poslednipozn"></span>
<span style="flex:1"></span><button class="sec" id="smazat">Smazat</button><button id="odeslat">Odeslat poznámky e-mailem</button></div></div>

const kc=x=>x==null?'—':(x<0?'−':'')+Math.abs(x).toLocaleString('cs-CZ',{minimumFractionDigits:0,maximumFractionDigits:2})+' Kč';
const dt=s=>s?(+s.slice(8,10))+'. '+(+s.slice(5,7))+'. '+s.slice(0,4):'';
async function prihlas(){
  const jm=$('#jm').value.trim().toLowerCase(), hs=$('#hs').value, u=UCTY[jm];
  if(!u){$('#chyba').textContent='Neznámé jméno.';return}
  $('#chyba').textContent='Ověřuji…';
  try{
    const zakl=await crypto.subtle.importKey('raw',new TextEncoder().encode(hs),'PBKDF2',false,['deriveKey']);
    const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(u.salt),iterations:u.iter,hash:'SHA-256'},zakl,{name:'AES-GCM',length:256},false,['decrypt']);
    const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(u.iv)},kek,b64(u.klic));
    KLIC=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
    const b=b64(BALIK), pl=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},KLIC,b.slice(12));
    const txt=await new Response(new Blob([pl]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    D=JSON.parse(txt); UZ=jm; try{POZN=JSON.parse(localStorage.getItem('fdu_pozn_'+UZ)||'[]')}catch(e){POZN=[]}
    $('#login').classList.add('skryt'); $('#app').classList.remove('skryt'); vykresli('prehled'); lista();
  }catch(e){$('#chyba').textContent='Špatné heslo.'}
}
$('#prihlasit').onclick=prihlas; $('#hs').addEventListener('keydown',e=>{if(e.key==='Enter')prihlas()});
async function otevriDoklad(klic,nazev){
  $('#mtit').textContent=nazev; $('#mobsah').innerHTML='<p class="mut" style="padding:16px">Dešifruji…</p>'; $('#modal').style.display='flex';
  const r=await fetch('doc/'+klic+'.bin'); const b=new Uint8Array(await r.arrayBuffer());
  const pl=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},KLIC,b.slice(12)));
  const nl=pl.indexOf(10), typ=new TextDecoder().decode(pl.slice(0,nl)), url=URL.createObjectURL(new Blob([pl.slice(nl+1)],{type:typ}));
  $('#mobsah').innerHTML=typ.startsWith('image')?`<img src="${url}">`:`<iframe src="${url}"></iframe>`;
}
