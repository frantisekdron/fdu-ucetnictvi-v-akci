        <input inputmode="decimal" value="${esc(q.mnozstvi)}" oninput="FORM.polozky[${i}].mnozstvi=this.value;fakSum()" aria-label="Množství"><input inputmode="decimal" placeholder="Cena" value="${esc(q.cena)}" oninput="FORM.polozky[${i}].cena=this.value;fakSum()" aria-label="Cena">
        ${pl?`<select onchange="FORM.polozky[${i}].sazba_dph=+this.value;fakSum()" aria-label="DPH">${[21,12,0].map(s=>`<option value="${s}" ${+q.sazba_dph===s?'selected':''}>${s} %</option>`).join('')}</select>`:''}
        <button class="ibtn" onclick="FORM.polozky.splice(${i},1);if(!FORM.polozky.length)FORM.polozky.push({popis:'',mnozstvi:1,cena:'',sazba_dph:${pl?21:0}});fakKresli()" aria-label="Odebrat položku">${ico('x')}</button></div>`).join('')}
      <button class="btn sm ghost" onclick="FORM.polozky.push({popis:'',mnozstvi:1,cena:'',sazba_dph:${pl?21:0}});fakKresli()">${ico('plus')}Přidat položku</button></div>
    <div><label class="l">Poznámka na faktuře (nepovinné)</label><input value="${esc(FORM.poznamka)}" oninput="FORM.poznamka=this.value" placeholder="např. číslo objednávky, odkaz na video…"></div>
    <div><label class="l">Design faktury</label><div class="dsg">${F.designy.map(d=>`<label class="${FORM.design===d.kod?'on':''}"><input type="radio" name="dsg" ${FORM.design===d.kod?'checked':''} onchange="FORM.design='${d.kod}';fakKresli()">${d.nahled?`<img src="${d.nahled}" alt="">`:''}${esc(d.nazev)}</label>`).join('')}</div>
      <label class="chk" style="margin-top:8px"><input type="checkbox" ${FORM.vychozi?'checked':''} onchange="FORM.vychozi=this.checked"> Nastavit jako výchozí design</label></div>
    ${upr?'':`<details class="mini"><summary>Text e-mailu odběrateli</summary><textarea rows="5" oninput="FORM.text=this.value" placeholder="Dobrý den, v příloze Vám posíláme fakturu…">${esc(FORM.text)}</textarea></details>`}
    <div class="sumf" id="fsum"></div>
    <div class="fakt-akce" style="--pc:${p.barva}"><span class="ptag" style="--pc:${p.barva};margin-right:auto">${esc(p.stitek)} · ${pl?'s DPH':'bez DPH'}</span><button class="btn" onclick="fakAkce('nahled')">${ico('eye')}Náhled PDF</button>
      ${upr?`<button class="btn pri" id="fbtnv" onclick="fakAkce('upravit')">${ico('check')}Uložit změny</button>`
        :`<button class="btn" id="fbtnv" onclick="fakAkce('vystavit')">Vystavit</button><button class="btn pri" id="fbtnp" onclick="fakAkce('vystavit',true)">${ico('send')}Vystavit a poslat</button>`}</div>
  </div></div>`;
  fakSum(); fakTlacitka() }
function fakSum(){ const S=fakSoucty(), pl=PROF(FORM.profil).platce, e=$('#fsum'); if(!e)return;
  e.innerHTML=(pl?`<span>Základ <b class="num">${kc(S.z)}</b></span><span>DPH <b class="num">${kc(S.d)}</b></span>`:'')+`<span>Celkem <b class="num">${kc(S.c)}</b></span>` }
function fakTlacitka(){ const ok=(FORM.odb||/^\d{8}$/.test(FORM.hledat.trim()))&&FORM.polozky.some(p=>p.popis.trim()&&parseFloat(String(p.cena).replace(',','.'))>0);
  ['fbtnv','fbtnp'].forEach(id=>{const b=$('#'+id); if(b)b.disabled=!ok}); const b=$('#fbtnp'); if(b&&!/@/.test(FORM.email))b.disabled=true }
function fakOdb(v){ FORM.hledat=v; const F=FK(), x=F.odberatele.find(o=>v===o.nazev+(o.ico?' · IČO '+o.ico:'')||v===o.nazev);
  if(x){ FORM.odb=Object.assign({},x); if(x.email&&!FORM.email)FORM.email=x.email; fakKresli(); return }   // profil se NEMĚNÍ – jen upozornění
  if(/^\s*\d{8}\s*$/.test(v)){ FORM.odb={ico:v.trim()}; fakKresli(); return } fakTlacitka() }
function fakSpec(){ const o=FORM.odb||{ico:FORM.hledat.trim()}, pl=PROF(FORM.profil).platce;
  return {profil:FORM.profil, odberatel:Object.assign({},o,{email:FORM.email||o.email||null}), datum_vystaveni:FORM.datum, duzp:pl?FORM.duzp:FORM.datum,
    splatnost_dni:+FORM.splatnost, poznamka:FORM.poznamka, polozky:FORM.polozky.filter(p=>p.popis.trim()).map(p=>({popis:p.popis.trim(),mnozstvi:parseFloat(String(p.mnozstvi).replace(',','.'))||1,
    cena:parseFloat(String(p.cena).replace(/\s/g,'').replace(',','.'))||0,sazba_dph:pl?+p.sazba_dph:0}))} }
async function fakAkce(akce,poslat){ const S=fakSoucty(), spec=fakSpec(), ref=Math.random().toString(36).slice(2,9), komu=FORM.email, p=PROF(FORM.profil);
  const komu_t=(FORM.odb&&FORM.odb.nazev)||('IČO '+spec.odberatel.ico), kdo=`Z ${p.stitek.toUpperCase()} (${p.nazev}, ${p.platce?'s DPH':'bez DPH'})`;
  if(akce==='vystavit'&&!confirm(`Vystavit fakturu ${p.dalsi||''} za ${kc(S.c)} pro ${komu_t}?\n\n${kdo}${poslat?`\nA poslat ji na ${komu}.`:''}`))return;
  if(akce==='upravit'&&!confirm(`Uložit změny faktury ${(FK().faktury.find(f=>f.id===FORM.uprava)||{}).cislo||''} – ${kc(S.c)} pro ${komu_t}?\n\n${kdo}\nStaré PDF půjde do Koše, nové se vyrobí.`))return;
  try{ await posli(Object.assign({druh:'faktura',akce,ref,spec,design:FORM.design,poslat:poslat?{komu,text:FORM.text||null}:null},akce==='upravit'?{id:FORM.uprava}:{}));
    if(FORM.vychozi&&akce!=='nahled') posli({druh:'faktura',akce:'design',ref:ref+'d',design:FORM.design}).catch(()=>{});
    FAK_CEKA[ref]=akce; if(akce==='upravit')FAK_CEKA['f'+FORM.uprava]='Mac ukládá změny…';
    toast(akce==='nahled'?'Mac chystá náhled PDF…':akce==='upravit'?'Mac ukládá změny…':'Mac vystavuje fakturu…') }
  catch(e){ toast('Nepovedlo se odeslat na Mac ('+e.message+').',1) } }
async function fakPoslat(id){ const x=FK().faktury.find(f=>f.id===id); if(!x)return; const komu=prompt(`Poslat fakturu ${fakNazev(x)} na e-mail:`,x.email||''); if(!komu)return;
  const ref=Math.random().toString(36).slice(2,9);
  try{ await posli({druh:'faktura',akce:'poslat',ref,profil:x.profil,cislo:x.cislo,komu}); FAK_CEKA['f'+x.id]='Odesílám na '+komu+'…'; toast('Mac posílá fakturu…'); if(FAKD===id)fakDetail(id); else prekresli(true) }
  catch(e){ toast('Nepovedlo se ('+e.message+').',1) } }
async function fakturaOdpoved(o,priloha){ toast(o.text||'Hotovo',o.stav==='chyba'||(o.zkouska&&!o.zkouska.ok));
  const fx=o.id?FK().faktury.find(f=>f.id===o.id):FK().faktury.find(f=>f.profil===o.profil&&f.cislo===o.cislo);
  if(o.stav==='chyba'){ cink(); if(fx){ delete FAK_CEKA['f'+fx.id]; if(FAKD===fx.id)fakDetail(fx.id) } return }
  if((o.akce==='nahled'||o.akce==='pdf')&&priloha&&priloha.url){ try{ const b=new Uint8Array(await (await fetch(priloha.url)).arrayBuffer()),
      k=await crypto.subtle.importKey('raw',b64(D.meta.most.klic),'AES-GCM',false,['decrypt']), pl=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},k,b.slice(12));
      if(o.akce==='pdf'&&o.stahnout){ ulozSoubor(o.nazev||'faktura.pdf',pl); return }
      $('#mtit').textContent=o.akce==='pdf'?(o.text||'PDF'):'Náhled faktury'; $('#mobsah').innerHTML=`<iframe src="${URL.createObjectURL(new Blob([pl],{type:'application/pdf'}))}" title="PDF"></iframe>`; $('#modal').style.display='flex' }
    catch(e){ toast('PDF se nepodařilo otevřít ('+e.message+').',1) } return }
  cink();
  if(o.akce==='vystavit'){ fakZavri(); FAK_CEKA['p:'+o.profil+':'+o.cislo]='Právě vystaveno – web se za chvíli obnoví' }
  if(fx&&['poslat','upravit','smazat','stornovat','zaplaceno'].includes(o.akce)){ FAK_CEKA['f'+fx.id]=o.text+' Web se za chvíli obnoví.'; if(o.akce!=='poslat')fakZavri() }
  if(TAB==='faktury'){ if(FAKD&&fx&&FAKD===fx.id)fakDetail(fx.id); else prekresli(true) } }

// QR platba DPH (Franta 20. 11. 2026) – naskenovat v bankovní appce; po platbě (výpis z banky) jen „zaplaceno“
const dphZapl=()=>{ const p=D.platba_dph||{}; return p.zaplaceno||p.zaplaceno_rucne||null };
const dphHotovo=()=>!!(D.platba_dph&&D.platba_dph.podano_rucne&&dphZapl());
const dphZbyva=()=>{ const p=D.platba_dph; if(!p)return 'Podat a zaplatit'; return p.podano_rucne?'Zaplatit':dphZapl()?'Podat':'Podat a zaplatit' };
function qrPlatba(){ const p=D.platba_dph; if(!p)return ''; const ja=UZ==='franta', zapl=dphZapl();
  const chk=(pole,datum,text)=>`<label class="qchk${datum?' on':''}"><input type="checkbox" ${datum?'checked':''} ${ja?'':'disabled'} onchange="dphStav('${pole}',this.checked)"><span>${text}${datum?' · '+dk(datum):''}</span></label>`;
  const radky=`<div class="qchks">${chk('podano',p.podano_rucne,'Odesláno přes EPO')}${chk('zaplaceno',zapl,'Zaplaceno')}</div>`;
  if(zapl) return `<div class="qrp hotovo">${ico('check')}<div><span>DPH ${esc(p.zprava.replace('DPH ',''))} zaplacené ${dt(zapl)} – ${p.zaplaceno?'potvrdil to výpis z banky.':'podle tebe, výpis z banky to ještě nepotvrdil.'}</span>${radky}</div></div>`;
  return `<div class="qrp"><img src="${p.qr}" alt="QR kód pro platbu DPH ${esc(kc(p.castka))}" width="128" height="128">
    <div><b>Zaplatit QR kódem</b><span class="sm">Naskenuj v bankovní aplikaci – vyplní se částka, účet i variabilní symbol.</span>
      <dl><dt>Částka</dt><dd class="num">${kc(p.castka)}</dd><dt>Účet</dt><dd class="mono">${esc(p.ucet)}</dd><dt>VS</dt><dd class="mono">${esc(p.vs)}</dd><dt>Splatnost</dt><dd>${dt(p.termin)}</dd></dl>${radky}</div></div>` }
async function dphStav(pole,zap){ const p=D.platba_dph, n=new Date(), dnes=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
  const k=pole==='podano'?'podano_rucne':'zaplaceno_rucne', puvodne=p[k]; p[k]=zap?(p[k]||dnes):null; prekresli(true);
  try{ await posli({druh:'dph_stav',obdobi:p.obdobi,[pole]:zap}); toast(zap?(pole==='podano'?'Odesláno – zapsáno.':'Zaplaceno – zapsáno.'):'Odškrtnuto.') }
  catch(e){ p[k]=puvodne; prekresli(true); toast('Nepodařilo se uložit – zkus to znovu.') } }

/* ---------- ČÍSLA – DPH, výsledek, daň z příjmů, rozvaha ---------- */
function cisla(){ const kh=D.kh, s=r=>r?kc((r.zakl_dane1||0)+(r.zakl_dane2||0)):'—', R=D.rok, dp=D.prehled.dppo, rz=R.rozvaha, t=termDPH(), dph=D.prehled.dph;
  const tot=R.mesice.reduce((a,m)=>({v:a.v+m.vynosy,n:a.n+m.naklady,r:a.r+m.vysledek}),{v:0,n:0,r:0}), maxS=Math.max(...R.skupiny.map(x=>Math.abs(x.castka)),1);
  return hlavicka(esc(D.meta.obdobi_nazev)+' · rok '+D.meta.obdobi.slice(0,4),'Čísla','Přiznání DPH ke stažení, výsledek roku, odhad daně z příjmů a rozvaha.')
  +`<section class="card pad"><div class="sec-h"><div><div class="eyebrow">Přiznání k DPH · ${esc(D.meta.obdobi_nazev)}</div><h2 style="font-size:28px">${dph>=0?'K úhradě':'Vrátí FÚ'} ${kc(Math.abs(dph))}</h2>
      <p style="margin-top:4px">${dphHotovo()?'Odesláno i zaplaceno ✓':dphZbyva()+' do '+dt(t)}</p></div>
      <div class="ph-act"><button class="btn pri" onclick="stahni('DPHDP3_${D.meta.obdobi}.xml',D.xml.dp3)">${ico('dl')}Přiznání DPH (XML)</button><button class="btn" onclick="stahni('DPHKH1_${D.meta.obdobi}.xml',D.xml.kh)">${ico('dl')}Kontrolní hlášení (XML)</button></div></div>
    <p class="mut sm">XML se nahraje na portál MOJE daně (EPO) → „Načíst ze souboru“ → zkontrolovat → podat. Nic se neodesílá samo.</p>
    ${qrPlatba()}
    ${D.varovani.length?D.varovani.map(v=>`<div class="callout warn"><b>Pozor:</b> ${esc(v)}</div>`).join(''):''}
    <div class="grid2" style="margin-top:16px;align-items:start"><div class="tbl"><table><tr><th>Ř.</th><th>Přiznání</th><th class="r">Kč</th></tr>
      ${D.priznani.map(r=>`<tr${r.klic==='dano_da'?' class="tot"':''}><td class="mono">${esc(r.radek)}</td><td>${esc(r.popis)}</td><td class="r num">${kc(r.castka)}</td></tr>`).join('')}</table></div>
    <div class="tbl"><table><tr><th>Kontrolní hlášení</th><th class="r">Řádků</th><th class="r">Základ</th></tr>
      <tr><td>A.2 – služby ze zahraničí</td><td class="r">${kh.A2.length}</td><td class="r num">${kc(kh.A2.reduce((a,r)=>a+(r.zakl_dane1||0),0))}</td></tr>
      <tr><td>A.4 – vydané nad 10 000 Kč</td><td class="r">${kh.A4.length}</td><td class="r num">${kc(kh.A4.reduce((a,r)=>a+(r.zakl_dane1||0),0))}</td></tr>
      <tr><td>A.5 – vydané do 10 000 Kč</td><td class="r">souhrn</td><td class="r num">${s(kh.A5)}</td></tr>
      <tr><td>B.2 – přijaté nad 10 000 Kč</td><td class="r">${kh.B2.length}</td><td class="r num">${kc(kh.B2.reduce((a,r)=>a+(r.zakl_dane1||0)+(r.zakl_dane2||0),0))}</td></tr>
      <tr><td>B.3 – přijaté do 10 000 Kč</td><td class="r">souhrn</td><td class="r num">${s(kh.B3)}</td></tr></table></div></div></section>

  <section class="card pad sec"><div class="sec-h"><div><h2>Rok ${D.meta.obdobi.slice(0,4)} po měsících</h2><p>Výnosy <b class="ok num">${kc(tot.v)}</b> · náklady <b class="num">${kc(tot.n)}</b> · výsledek <b class="num ${tot.r<0?'bad':'ok'}">${kc(tot.r)}</b></p></div>
    <div class="leg"><span><i style="background:var(--in)"></i>výnosy</span><span><i style="background:var(--out)"></i>náklady</span></div></div>
    ${grafRok()}<p class="mut xs" style="margin-top:8px">Leden–září z Pohody (Lenka), od října zaúčtováno automaticky z dokladů a banky.</p>
    <details class="mini"><summary>Tabulka po měsících</summary><div class="tbl"><table><tr><th>Měsíc</th><th class="r">Výnosy</th><th class="r">Náklady</th><th class="r">Výsledek</th></tr>
    ${R.mesice.map(m=>`<tr><td>${m.mesic}</td><td class="r num">${kc(m.vynosy)}</td><td class="r num">${kc(m.naklady)}</td><td class="r num ${m.vysledek<0?'bad':'ok'}">${kc(m.vysledek)}</td></tr>`).join('')}
    <tr class="tot"><td>Celkem</td><td class="r num">${kc(tot.v)}</td><td class="r num">${kc(tot.n)}</td><td class="r num">${kc(tot.r)}</td></tr></table></div></details></section>

  <div class="grid2 sec" style="align-items:start"><section class="card pad" id="s-dppo"><div class="sec-h"><h2>Daň z příjmů za rok – odhad</h2></div>
    <div class="kv"><span>Výsledek k ${dk(D.meta.stav_k)}</span><span class="num">${kc(dp.vysledek_k_datu)}</span></div>
    <div class="kv"><span>− odpisy majetku do konce roku</span><span class="num">${kc(-dp.plan_odpisu_do_konce_roku)}</span></div>
    <div class="kv b"><span>= výsledek roku</span><span class="num">${kc(dp.vysledek_rok)}</span></div>
    <div class="kv"><span>+ nedaňové náklady</span><span class="num">${kc(dp.nedanove)}</span></div>
    <div class="kv"><span>− daňová ztráta z minulých let</span><span class="num">${kc(-dp.ztrata_minulych_let)}</span></div>
    <div class="kv b"><span>Daň (21 %)</span><span class="num">${kc(dp.dan)}</span></div>
    ${dp.nova_ztrata<0?`<div class="callout">Letos vychází daňová ztráta <b class="num">${kc(dp.nova_ztrata)}</b> – dá se odečíst od zisku v dalších 5 letech. Každá další tržba do konce roku ji jen snižuje (daň zatím 0 Kč).</div>`:''}</section>
  <section class="card pad"><div class="sec-h"><h2>Náklady letos podle druhu</h2></div>
    ${R.skupiny.map(x=>`<div style="padding:7px 0;border-top:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:10px;font-size:13.5px"><span>${esc(x.nazev)}</span><span class="num">${kc(x.castka)}</span></div>
      <div class="hbar" style="width:${Math.max(2,Math.abs(x.castka)/maxS*100)}%;margin-top:5px"></div></div>`).join('')}</section></div>

  <section class="sec"><div class="sec-h"><h2>Rozvaha k ${dt(D.meta.stav_k)}</h2></div><div class="grid2" style="align-items:start">
    <div class="card pad"><h3 style="margin-bottom:6px">Aktiva <span class="mut">– co firma má</span></h3>${rz.aktiva.map(x=>`<div class="kv"><span>${esc(x.nazev)}</span><span class="num">${kc(x.castka)}</span></div>`).join('')}<div class="kv b"><span>Celkem</span><span class="num">${kc(rz.aktiva_celkem)}</span></div></div>
    <div class="card pad"><h3 style="margin-bottom:6px">Pasiva <span class="mut">– z čeho je to financované</span></h3>${rz.pasiva.map(x=>`<div class="kv"><span>${esc(x.nazev)}</span><span class="num ${x.castka<0?'bad':''}">${kc(x.castka)}</span></div>`).join('')}<div class="kv b"><span>Celkem</span><span class="num">${kc(rz.pasiva_celkem)}</span></div></div></div></section>` }
function grafRok(){ const M=D.rok.mesice, W=1000, H=210, T=14, B=H-26, max=Math.max(...M.map(m=>Math.max(m.vynosy,m.naklady)),1), gw=(W-40)/M.length, bw=Math.min(22,gw*.3);
  const y=v=>B-(v/max)*(B-T);
  let s=`<line x1="20" x2="${W-20}" y1="${B}" y2="${B}" stroke="var(--line2)"/>`;
  [.5,1].forEach(f=>{ s+=`<line x1="20" x2="${W-20}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="22" y="${y(max*f)-4}">${Math.round(max*f/1000).toLocaleString('cs-CZ')} tis.</text>` });
  M.forEach((m,i)=>{ const cx=20+gw*i+gw/2;
    s+=`<rect x="${cx-bw-2}" y="${y(m.vynosy)}" width="${bw}" height="${B-y(m.vynosy)}" rx="3" class="t-in"><title>${m.mesic}: výnosy ${kc(m.vynosy)}</title></rect>`;
    s+=`<rect x="${cx+2}" y="${y(m.naklady)}" width="${bw}" height="${B-y(m.naklady)}" rx="3" class="t-out"><title>${m.mesic}: náklady ${kc(m.naklady)}</title></rect>`;
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${m.mesic.slice(0,3)}</text>` });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Výnosy a náklady po měsících">${s}</svg>` }
</script></body></html>
